<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Omi waiting with you">
  <!-- Seed Omi idle smile (warm) + concentric rings that orbit — balanced, not sad flat-mouth -->
  <style>svg{color:#111111}</style>

  <g class="rings" stroke="currentColor" stroke-linecap="round" fill="none">
    <circle class="ring r1" cx="32" cy="32" r="21.5" stroke-width="1.85" stroke-dasharray="58 77" stroke-dashoffset="12"/>
    <circle class="ring r2" cx="32" cy="32" r="27" stroke-width="1.5" stroke-dasharray="42 128" stroke-dashoffset="40"/>
  </g>

  <!-- Seed idle face — smile from omi-exports/svg/seed/idle (+8,+8) -->
  <g class="omi">
    <circle cx="32" cy="32" r="15.5" stroke="currentColor" stroke-width="1.85"/>
    <circle class="eye eye-l" cx="25" cy="30" r="1.85" fill="currentColor"/>
    <circle class="eye eye-r" cx="39" cy="30" r="1.85" fill="currentColor"/>
    <path class="smile" d="M25.5 37.5c2.2 2.4 6.8 2.4 9 0" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"/>
  </g>
</svg>
