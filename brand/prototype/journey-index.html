    function openSheet(html) {
      const scrim = $("ouScrim");
      const sheet = $("ouSheet");
      if (!scrim || !sheet || !html) return;
      sheet.innerHTML = html;
      scrim.hidden = false;
      sheet.hidden = false;
      state.sheetOpen = true;
      requestAnimationFrame(() => {
        scrim.classList.add("open");
        sheet.classList.add("open");
      });
      const first = sheet.querySelector("input, .btn-primary, .manage-row");
      if (first) setTimeout(() => first.focus({ preventScroll: true }), 60);
    }

    function closeSheet(immediate = false) {
      const scrim = $("ouScrim");
      const sheet = $("ouSheet");
      if (!scrim || !sheet || sheet.hidden) return;
      state.sheetOpen = false;
      scrim.classList.remove("open");
      sheet.classList.remove("open");
      const finish = () => {
        if (state.sheetOpen) return;
        scrim.hidden = true;
        sheet.hidden = true;
        sheet.innerHTML = "";
      };
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (immediate || reduce) finish();
      else setTimeout(finish, 320);
    }

    function showToast(msg, undo) {
      const el = $("ouToast");
      const m = $("ouToastMsg");
      const u = $("ouToastUndo");
      if (!el || !m || !u) return;
      m.textContent = msg;
      u.hidden = !undo;
      u.onclick = undo ? () => { hideToast(); undo(); } : null;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(hideToast, undo ? 4500 : 2200);
    }
    function hideToast() {
      $("ouToast")?.classList.remove("show");
    }

    function newGoalFromDraft(ng) {
      const d = ng.draft;
      const id = "g" + Date.now().toString(36);
      const mins = parseInt(ng.time, 10) || 15;
      const actions = d.actions.filter(a => a.on).map((a, i) => ({
        id: `${id}a${i}`, title: a.title, minutes: a.minutes, kind: "candidate", stat: "New · Omi can pick it"
      }));
      if (d.habit) actions.unshift({ id: `${id}h`, title: d.habit, minutes: Math.min(mins, 10), kind: "habit", stat: "Habit · new" });
      const ms = d.milestones.filter(m => m.on).map(m => ({ t: m.t, done: false, when: "" }));
      const goal = {
        id, area: ng.area === "Other" ? "Custom" : ng.area, title: d.title.trim(),
        status: ng.placement === "focus" ? "focus" : "active", health: "new",
        progress: 0, since: 0, sessions: 0, lastDone: "not yet",
        outcome: d.outcome || "—", why: ng.whyNow, cadence: "3× / week", size: mins, horizon: ng.horizon,
        weeks: [0, 0, 0, 0, 0, 0, 0, 0], milestones: ms, actions,
        insight: {
          rate: 0, best: "—", streakNote: "New — Omi is still learning this one",
          helps: [], hurts: [], quotes: [],
          omi: "New goal. I'll learn what fits after a few +1s — expect small asks first."
        }
      };
      refreshCurrent(goal);
      if (goal.milestones[0]) goal.milestones[0].when = "First up";
      return goal;
    }

    function pauseGoal(g, note) {
      g.prev = { status: g.status, health: g.health };
      g.status = "paused";
      g.health = "paused";
      g.pausedNote = note;
    }

    /* ── +1 loop helpers ─────────────────────────────── */
    const WEEK_DAYS = ["M", "T", "W", "T", "F", "S", "S"];
    function weekCount() { return state.week.filter(Boolean).length; }
    function focusGoal() { return state.goals.find(g => g.status === "focus") || null; }

    function plusWeekHtml(opts = {}) {
      return `<div class="plus-week" role="img" aria-label="${weekCount()} +1s this week">
        ${WEEK_DAYS.map((d, i) => {
          const v = state.week[i];
          const isToday = i === state.todayIdx;
          const cls = [v === "done" ? "done" : v === "part" ? "part" : "", isToday ? "today" : "", isToday && opts.pop && v ? "pop" : ""].join(" ");
          return `<div class="pw-cell ${cls}"><span class="pw-dot" aria-hidden="true">${v ? "+1" : ""}</span>${isToday ? "Today" : d}</div>`;
        }).join("")}
      </div>`;
    }

    function crossMilestone(g) {
      const m = g.milestones.find(x => x.current) || g.milestones.find(x => !x.done);
      if (!m) return null;
      m.done = true;
      m.when = "Today";
      refreshCurrent(g);
      g.msReps = 0;
      g.msNeed = 4;
      const next = g.milestones.find(x => x.current);
      if (next) next.when = "4 reps to go";
      state.lastMilestone = { goalId: g.id, title: m.t, next: next ? next.t : null };
      return m.t;
    }

    function recordPlusOne(kind = "full") {
      const prev = state.todayResult;
      if (prev === "full") return state.lastBump;
      const g = focusGoal();
      const gain = kind === "full" ? (prev === "part" ? 2 : 3) : 1;
      if (!prev) {
        state.totalPlus += 1;
        if (kind === "part") state.partPlus += 1;
      } else if (kind === "full") {
        state.partPlus = Math.max(0, state.partPlus - 1);
      }
      state.todayResult = kind;
      state.week[state.todayIdx] = kind === "full" ? "done" : "part";
      state.progressEmpty = false;
      let bump = null;
      if (g) {
        const from = g.progress;
        g.progress = Math.min(100, g.progress + gain);
        g.lastDone = "Today";
        const repsBefore = g.msReps ?? 0;
        let crossed = null;
        if (!prev) {
          g.sessions += 1;
          if (g.msNeed) {
            g.msReps = repsBefore + 1;
            if (g.msReps >= g.msNeed) crossed = crossMilestone(g);
          }
        }
        bump = { goalId: g.id, from, to: g.progress, repsBefore, need: crossed ? repsBefore + 1 : g.msNeed, crossed };
      }
      state.lastBump = bump;
      return bump;
    }

    function tinyOf(o) {
      if (o.area === "English") {
        return {
          area: o.area, title: "Say 3 sentences about today's work — out loud", minutes: 2, tiny: true,
          why: "Tiny still counts. Two minutes keeps the thread — the full version waits for a better day.",
          steps: ["Pick one thing you did today", "Say 3 sentences about it, out loud", "Stop — that's the +1"]
        };
      }
      return {
        area: o.area, title: `First 2 minutes of: ${o.title}`, minutes: 2, tiny: true,
        why: "Tiny still counts. Starting is the hard part — two minutes keeps the thread.",
        steps: ["Open it", "Do 2 honest minutes", "Stop — that's the +1"]

    function todayWhisper() {
      if (state.comeback) return "Welcome back. Tiny today is the whole plan — nothing to catch up.";
      if (state.oneup.tiny) return "Tiny version on. Showing up beats sizing up.";
      if (state.energy === "Low") return "Low day — I kept Must short and parked the rest.";
      if (state.dayPart === "evening") return "Evenings are your hard slot. Two minutes still counts.";
      return "English skipped twice — TikTok can wait.";

    function fmtClock(sec) {
      const s = Math.max(0, Math.round(sec));
      return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    }
    // Dogfood: wall Focus under 1 min so execute → ended → complete is walkable.
    // Product copy still shows `o.minutes`; ring/timer uses this budget only.
    const FOCUS_DOGFOOD_SECONDS = 45;
    function ensureFocus() {
      const o = state.oneup;
      if (state.focus.title !== o.title) {
        const total = FOCUS_DOGFOOD_SECONDS;
        state.focus = { title: o.title, total, left: total, running: true, steps: o.steps.map(() => false), ended: false };
      }
      return state.focus;
    }
    function focusInProgress() {
      const f = state.focus;
      return !state.completedToday && f.title === state.oneup.title && f.left < f.total;
    }
    let focusHandle = null;
    function clearFocusTimer() {
      if (focusHandle != null) {
        clearInterval(focusHandle);
        focusHandle = null;
      }
    }
    function paintFocus() {
      const f = state.focus;
      const ring = $("focusRing");
      if (!ring) return;
      const pct = f.total ? Math.round(((f.total - f.left) / f.total) * 100) : 0;
      ring.style.setProperty("--p", pct);
      ring.classList.toggle("done", f.ended);
      $("focusTime").textContent = f.ended ? "+1" : fmtClock(f.left);
      $("focusState").textContent = f.ended ? "Time — that's your +1" : f.running ? "Focus · Omi's here" : "Paused";
      const tog = $("focusToggle");
      if (tog) tog.textContent = f.running ? "Pause" : "Resume";
    }
    function startFocusTimer() {
      clearFocusTimer();
      paintFocus();
      focusHandle = setInterval(() => {
        const f = state.focus;
        if (state.step !== "execute") {
          clearFocusTimer();
          return;
        }
        if (!f.running || f.ended) return;
        f.left -= 1;
        if (f.left <= 0) {
          f.left = 0;
          f.ended = true;
          f.running = false;
          const live = $("focusLive");
          if (live) live.textContent = "Time is up. Mark complete when honest.";
          if (navigator.vibrate) navigator.vibrate([10, 40, 10]);
        }
        paintFocus();
      }, 1000);
    }

      const top = screen.scrollTop;
      render(state.step);

    const MOOD_LINES = {
      idle: "I'm here. No rush.",
      wave: "Hi — I'm Omi. Let's find your first +1.",
      think: "Sizing today to your energy…",
      quiet: "Skipping is fine. Nothing is broken.",
      listen: "Tell me one thing about today.",
      celebrate: "You moved English forward today.",

      blush: "Want to share this quietly?",
      worry: "Lost days don't delete anything. Let's restart small.",
      cheer: "Chapter complete. What did this change for you?"
    };
    const PLUS_POOLS = {
      g1: { items: ["Speak about today's work for 20 minutes", "Shadow a 5-min podcast out loud", "Rehearse a 2-min standup update"], tiny: "Say 3 sentences about today's work — out loud" },
      g2: { items: ["Ship one OneUp UI polish", "Fix one TestFlight bug", "Write the release notes"], tiny: "Open the build, fix one pixel" },
      g3: { items: ["Skim EM promo checklist", "Write one 1:1 note", "Draft one promo packet bullet"], tiny: "Name one thing you led this week" },
      g4: { items: ["20-min walk after work", "Bodyweight set × 3"], tiny: "2 minutes of stretching" },
      g6: { items: ["Read 10 pages before bed"], tiny: "Read one page" }
    };
    const YEAR_MILESTONES = [
      "Read 30 nights in a row", "Speak 5 min without notes", "Today Pack works end-to-end",
      "Summarize a stand-up aloud", "Promo packet outline", "First 5 TestFlight users", "Walk 3× a week for a month"
    ];
    const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const fmtDay = d => `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`;

    // Oldest-first list of every +1 (one per day max). Prototype data; app reads daily_selections.
    function plusHistory() {
      const year = state.jarYear;
      const total = year ? 268 : state.totalPlus;
      const todayIn = !!state.todayResult;
      let seed = 11;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const goalOrder = ["g1", "g1", "g1", "g2", "g1", "g3", "g2", "g4", "g6", "g1"];
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      if (!todayIn) d.setDate(d.getDate() - 1);
      let partLeft = year ? 21 : state.partPlus;
      const out = [];
      let gapRun = 0;
      while (out.length < total) {
        const n = out.length;
        const forcedGap = !year && n === 17 ? 5 : year && (n === 60 || n === 190) ? 9 : 0;
        if (forcedGap && gapRun < forcedGap) { gapRun++; d.setDate(d.getDate() - 1); continue; }
        if (n && !forcedGap && rnd() < (year ? 0.2 : 0.06)) { d.setDate(d.getDate() - 1); continue; }
        gapRun = 0;
        const isToday = todayIn && n === 0;
        const gid = goalOrder[Math.floor(rnd() * goalOrder.length)];
        const pool = PLUS_POOLS[gid];
        const kind = isToday ? state.todayResult : partLeft > 0 && rnd() < 0.13 ? (partLeft--, "part") : "full";
        const tiny = isToday ? !!state.oneup.tiny : kind === "full" && rnd() < 0.1;
        const g = state.goals.find(x => x.id === gid);
        out.push({
          date: new Date(d), goal: gid, area: g ? g.area : "Goal",
          title: isToday ? (state.doneTodayTitle || state.oneup.title) : tiny ? pool.tiny : pool.items[Math.floor(rnd() * pool.items.length)],
          kind, tiny, today: isToday
        });
        d.setDate(d.getDate() - 1);
      }
      out.reverse();
      const g1 = state.goals.find(x => x.id === "g1");
      const doneMs = year ? YEAR_MILESTONES : (g1 ? g1.milestones.filter(m => m.done).map(m => m.t) : []);
      const msAt = year ? [14, 41, 78, 119, 161, 207, 246] : [9, 26];
      doneMs.forEach((t, i) => { if (out[msAt[i]]) out[msAt[i]].milestone = t; });
      if (state.lastMilestone && out.length) out[out.length - 1].milestone = state.lastMilestone.title;
      for (let i = 1; i < out.length; i++) {
        const gap = Math.round((out[i].date - out[i - 1].date) / 86400000) - 1;
        if (gap >= 3) out[i].comeback = gap;
      }
      out.forEach((e, i) => { e.n = i + 1; });
      return out;
    }

    function plusByMonth(hist) {
      const map = new Map();
      hist.forEach(e => {
        const key = `${e.date.getFullYear()}-${String(e.date.getMonth()).padStart(2, "0")}`;
        if (!map.has(key)) map.set(key, { key, y: e.date.getFullYear(), m: e.date.getMonth(), items: [] });
        map.get(key).items.push(e);
      });
      return [...map.values()].reverse();
    }

    function plusMoments(hist) {
      if (!hist.length) return [];
      const first = hist[0];
      const list = [{ cls: "first", when: fmtDay(first.date), title: "Your first +1", body: `${esc(first.area)} · ${esc(first.title)}`, e: first }];
      const rounds = new Set([10, 25, 50, 100, 150, 200, 250, 300, 365, 500]);
      hist.forEach(e => {
        if (e.milestone) list.push({ cls: "ms", when: fmtDay(e.date), title: `Milestone · ${esc(e.milestone)}`, body: `After ${e.n} +1s. The next one got a little easier.`, e });
        if (e.comeback) list.push({ cls: "back", when: fmtDay(e.date), title: `Came back after ${e.comeback} days`, body: `${esc(e.title)} — nothing to catch up.`, e });
        if (rounds.has(e.n)) list.push({ cls: "", when: fmtDay(e.date), title: `+1 number ${e.n}`, body: `${esc(e.area)} · ${esc(e.title)}`, e });
      });
      const weeks = new Map();
      hist.forEach(e => {
        const monday = new Date(e.date);
        monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
        const k = monday.toDateString();
        weeks.set(k, (weeks.get(k) || { n: 0, d: monday }));
        weeks.get(k).n += 1;
      });
      const best = [...weeks.values()].sort((a, b) => b.n - a.n || b.d - a.d)[0];
      if (best && best.n >= 5) {
        const e = hist.filter(x => x.date >= best.d).find(Boolean);
        list.push({ cls: "", when: `Week of ${fmtDay(best.d)}`, title: `Best week · ${best.n}/7`, body: "Not a streak to protect — proof of what a good week looks like.", e });
      }
      const last = hist[hist.length - 1];
      if (last.today) list.push({ cls: "now", when: "Today", title: `+1 number ${last.n}`, body: `${esc(last.title)}${last.kind === "part" ? " · part counts" : ""}`, e: last });
      const seen = new Set();
      return list
        .filter(x => { const k = x.title + x.when; if (seen.has(k)) return false; seen.add(k); return true; })
        .sort((a, b) => b.e.n - a.e.n || (b.cls === "now") - (a.cls === "now"));
    }

    function plusStoryHtml() {
      const hist = plusHistory();
      const view = state.jarView;
      const total = hist.length;
      const todayIn = !!state.todayResult && !state.jarYear;
      const parts = hist.filter(e => e.kind === "part").length;
      const tinies = hist.filter(e => e.tiny).length;
      const msCount = hist.filter(e => e.milestone).length;
      const spanDays = total ? Math.round((hist[total - 1].date - hist[0].date) / 86400000) + 1 : 0;
      const seg = `
        <div class="seg" role="tablist" aria-label="How to see your +1s">
          ${[["months", "Months"], ["moments", "Moments"], ["goals", "By goal"]].map(([k, l]) =>
            `<button type="button" role="tab" aria-selected="${view === k}" class="${view === k ? "on" : ""}" data-action="jar-view" data-val="${k}">${l}</button>`).join("")}
        </div>`;
      const dot = e => `<i class="${e.today && todayIn ? "new" : e.kind === "part" ? "part" : ""}${e.milestone ? " ms" : ""}"></i>`;
      let body = "";
      let soWhat = "";

      if (view === "months") {
        const months = plusByMonth(hist);
        const nowY = new Date().getFullYear();
        const recent = months.slice(0, 12);
        const older = months.slice(12);
        const rows = recent.map(mo => {
          const open = state.jarOpen === mo.key;
          const label = `${MONTHS_SHORT[mo.m]}${mo.y !== nowY ? `<small>${mo.y}</small>` : ""}`;
          const detailItems = mo.items.slice().reverse();
          const shown = state.jarAll ? detailItems : detailItems.slice(0, 6);
          const detail = open ? `

              ${shown.map(e => `
                ${e.milestone ? `<div class="jd-row ms"><span class="jd-date">${fmtDay(e.date)}</span><span class="jd-title">Milestone · ${esc(e.milestone)}</span></div>` : ""}
                <div class="jd-row"><span class="jd-date">${e.today ? "Today" : fmtDay(e.date)}</span><span><span class="jd-title">${esc(e.title)}</span><span class="jd-tag">${esc(e.area)}${e.tiny ? " · 2‑min version" : ""}${e.kind === "part" ? " · part counts" : ""}</span></span></div>
                ${e.comeback ? `<div class="jd-row back"><span class="jd-date"></span><span class="jd-title">Came back after ${e.comeback} days</span></div>` : ""}`).join("")}
              ${detailItems.length > 6 ? `<button type="button" class="linkish jd-more" data-action="jar-all" style="min-height:36px">${state.jarAll ? "Show less" : `Show all ${detailItems.length}`}</button>` : ""}
            </div>` : "";
          return `
            <button type="button" class="jar-month" data-action="jar-open" data-val="${mo.key}" aria-expanded="${open}" aria-controls="jd-${mo.key}"
              aria-label="${MONTHS_SHORT[mo.m]} ${mo.y}: ${mo.items.length} +1s${mo.items.some(e => e.milestone) ? ", includes a milestone" : ""}">
              <span class="jm-label">${label}</span>
              <span class="jm-dots" aria-hidden="true">${mo.items.map(dot).join("")}</span>
              <span class="jm-count">${mo.items.length}</span>
            </button>${detail}`;
        }).join("");
        const olderByYear = [];
        older.forEach(mo => {
          let y = olderByYear.find(x => x.y === mo.y);
          if (!y) olderByYear.push((y = { y: mo.y, items: [] }));
          y.items.push(...mo.items);
        });
        const yearRows = olderByYear.map(y => `
          <div class="jar-month year" role="group" aria-label="${y.y}: ${y.items.length} +1s">
            <span class="jm-label">${y.y}</span>
            <span class="jm-dots" aria-hidden="true">${y.items.map(dot).join("")}</span>
            <span class="jm-count">${y.items.length}</span>
          </div>`).join("");
        body = `<div class="jar-months">${rows}${yearRows}</div>
          <div class="jar-legend"><span><b></b>+1</span><span><b class="part"></b>Part · counts</span><span><b class="ms"></b>Milestone</span></div>`;
        const thisMonth = months[0];
        const lastMonth = months[1];
        soWhat = thisMonth && lastMonth && thisMonth.items.length >= lastMonth.items.length
          ? `${MONTHS_SHORT[thisMonth.m]} already matches ${MONTHS_SHORT[lastMonth.m]}. <em>Tap a month to see what you actually did.</em>`
          : `Tap a month to see what you actually did. <em>Only what you did shows here — missed days aren't holes.</em>`;
      } else if (view === "moments") {
        const ms = plusMoments(hist);
        const cap = 8;
        body = `<ol class="moments">${ms.slice(0, cap).map(m => `
          <li class="${m.cls}"><p class="m-when">${m.when}</p><p class="m-title">${m.title}</p><p class="m-body">${m.body}</p></li>`).join("")}</ol>
          ${ms.length > cap ? `<p class="jd-more">${ms.length - cap} earlier moments in Months</p>` : ""}`;
        const backs = hist.filter(e => e.comeback).length;
        soWhat = backs
          ? `You came back ${backs === 1 ? "once" : `${backs} times`}. <em>That's the skill — not never stopping.</em>`
          : `${msCount} milestone${msCount === 1 ? "" : "s"} so far. <em>Each one started as a small +1.</em>`;
      } else {
        const counts = {};
        hist.forEach(e => {
          const c = counts[e.goal] || (counts[e.goal] = { n: 0, part: 0, tiny: 0, last: e.date, titles: {} });
          c.n++; if (e.kind === "part") c.part++; if (e.tiny) c.tiny++;

        body = `<div class="by-goal">${rows.map(([gid, c]) => {
          const g = state.goals.find(x => x.id === gid);
          const top = Object.entries(c.titles).sort((a, b) => b[1] - a[1])[0][0];
          const ago = Math.round((Date.now() - c.last) / 86400000);
          return `
            <div class="bg-row">
              <div class="bg-top"><b>${esc(g ? shortTitle(g.title, 28) : gid)}</b><span>${c.n}</span></div>
              <div class="track"><div class="fill" style="width:${Math.round((c.n / max) * 100)}%"></div></div>
              <p class="bg-meta">Most often: ${esc(shortTitle(top, 34))} · last ${ago <= 0 ? "today" : ago === 1 ? "yesterday" : `${ago}d ago`}${c.tiny ? ` · ${c.tiny} tiny` : ""}</p>
            </div>`;
        }).join("")}</div>`;
        const lead = rows[0];
        const g = lead && state.goals.find(x => x.id === lead[0]);
        soWhat = lead
          ? `${esc(g ? g.area : "Your focus")} holds ${Math.round((lead[1].n / total) * 100)}% of your +1s. <em>${g && g.status === "focus" ? "The focus is real, not just a label." : "Is that the goal you'd pick as focus?"}</em>`
          : "";
      }
      if (view !== "months" && !hasPlus()) {
        body = plusLockRow(view === "moments" ? "Firsts, comebacks and milestones — the story around your dots" : "See which goal your +1s actually feed", "progress");
        soWhat = `Every +1 is still here in Months. <em>Plus adds the story around them.</em>`;
      }

      return `
        <div class="card story-card">
          ${view !== "months" ? plusCap() : ""}
          <div class="story-head">
            <p class="caption">Every +1 so far</p>
            ${state.jarYear ? `<button type="button" class="linkish" data-action="jar-year" style="font-size:12px;min-height:32px">Back to live</button>` : ""}
          </div>
          <div class="story-head" style="justify-content:flex-start">
            <strong>${total}</strong>
            <span class="muted" style="font-size:13px">+1s · ${spanDays} days · ${msCount} milestone${msCount === 1 ? "" : "s"}${parts ? ` · ${parts} part` : ""}${tinies ? ` · ${tinies} tiny` : ""}</span>
          </div>
          ${seg}
          ${body}
          <p class="so-what">${soWhat}</p>
        </div>`;
    }

    /* ── OneUp Plus (stage C — pages/plus.md) ──────────────── */

      "lost-progress"() {
        const why = state.lostWhy || "Plan felt too big";
        const help = state.lostHelp || "Tiny OneUps";
        const g1 = goalById("g1");
        const defaultPick = why === "Lost motivation" || why === "Forgot" ? "five" : "two";
        const pick = state.restartPick || defaultPick;
        const opts = [
          ["two", "2 min · say 3 sentences out loud", "Smallest real step. Counts as today's +1."],
          ["five", "5 min · speak about anything today", "A little more — still no prep needed."],
          ["plan", "No +1 today · just plan tomorrow", "Totally fine. Omi drafts a tiny morning start."]
        ];
        const whyLine = {
          "Busy season": "busy seasons pass — the goal waits",
          "Lost motivation": "motivation follows action, not the other way round",
          "Plan felt too big": "the plan was too big, not you",
          "Forgot": "forgetting is a cue problem, not a character one",
          "Not sure": "we don't need a reason to start again"
        }[why] || "";
        const helpNote = {
          "Tiny OneUps": "Tiny default for 3 days — then I'll ask before sizing up.",
          "Reminders AM": "Morning nudge at 8:30 for the next 3 days (demo). Mornings are your strong slot.",
          "Different goal focus": "We can shift focus without losing English. Nothing gets deleted.",
          "Just listen": "Happy to listen first. Planning can wait."
        }[help];
        const helpCta = help === "Different goal focus" ? `<button type="button" data-go="goals">Review goals</button>`
          : help === "Just listen" ? `<button type="button" data-go="deepen">Tell Omi more</button>` : "";
        return `
          ${omiIllus("worry")}
          <p class="greet">Come back</p>
          <h2 class="title">Let's understand, then restart small</h2>
          <p class="muted">Lost days don't delete your ${g1.sessions} speaking sessions or ${state.totalPlus} +1s.</p>
          <p class="caption" style="margin-top:12px">What made it hard to return?</p>
          ${chips(["Busy season","Lost motivation","Plan felt too big","Forgot","Not sure"], "lostWhy", why)}
          <p class="caption">What would help for the next few days?</p>
          ${chips(["Tiny OneUps","Reminders AM","Different goal focus","Just listen"], "lostHelp", help)}
          ${omiNote(`Got it — ${whyLine}. ${helpNote}`, "listen", helpCta)}
          <p class="caption" style="margin-top:12px">Pick your restart</p>
          <div role="radiogroup" aria-label="Restart size">
            ${opts.map(([k, t, s]) => `
              <button type="button" class="place-card ${pick === k ? "on" : ""}" role="radio" aria-checked="${pick === k}" data-action="restart-pick" data-val="${k}">
                <span class="radio" aria-hidden="true"></span>
                <span><strong>${t}</strong><span>${s}</span></span>
              </button>`).join("")}
          </div>
          <button type="button" class="btn btn-primary" data-action="restart-tiny">${pick === "plan" ? "Plan tomorrow" : "Start again"}</button>
          <div class="btn-row">
            <button type="button" class="btn btn-secondary" data-go="deepen">Tell Omi more</button>
            <button type="button" class="btn btn-secondary" data-go="today">Just browse Today</button>
          </div>`;
      },

      "streak-good"() {

            ${omiIllus("proud")}
            <p class="greet">Tracking well</p>
            <h2 class="title">You're steadier than last month</h2>
            <div class="stat">

              <div><strong>${weekCount()}/7</strong><span>this week</span></div>

            <h2 class="title">${esc(g.title)}</h2>

              ${["M","T","W","T","F","S","S"].map((d,i) => `

          return `

            <div class="card">
              <ol class="steps" style="padding-left:4px;margin:0">

          ${trail}
          <div class="card">

      journey() {
        setTab("progress");
        return `
          ${omiIllus("proud")}
          <p class="greet">Your journey</p>
          <h2 class="title">Becoming more consistent</h2>
          <div class="timeline">
            <div class="t-item"><p class="caption">43 days ago</p><p class="body">“I want to become confident in English.”</p></div>

          <button type="button" class="btn btn-secondary" data-go="progress">Back to insights</button>`;

      goals() {
        setTab("goals");
        const f = state.goalsFilter;
        const live = liveGoals();
        const focus = live.find(g => g.status === "focus");
        const others = live.filter(g => g.status !== "focus");
        const paused = state.goals.filter(g => g.status === "paused");
        const chapters = state.goals.filter(g => g.status === "completed");
        const removed = state.goals.filter(g => g.status === "removed");
        const quiet = others.find(g => g.health === "quiet");

        const head = `
          <div class="page-head enter">
            <div>
              <p class="greet">Goals</p>
              <h2 class="title" style="margin:0">Portfolio</h2>
            </div>
            <button type="button" class="icon-btn" data-action="new-goal-menu" aria-label="Add goal">+</button>
          </div>
          <p class="muted">One system — not five. Focus gets Today priority; paused stays quiet.</p>`;

        if (!state.goals.some(g => g.status !== "removed")) return head + emptyGoalsCard();

        const load = `
          <div class="load-strip" role="img" aria-label="${live.length} active goals. Sweet spot is 3 or fewer.">
            <span class="load-dots" aria-hidden="true">${[0, 1, 2, 3].map(i => `<i class="${i < live.length ? (i >= 3 ? "over" : "on") : ""}"></i>`).join("")}</span>
            <span>${live.length} active · sweet spot ≤ 3</span>
          </div>
          <div class="seg" role="tablist" aria-label="Filter goals">
            ${[["active", `Active · ${live.length}`], ["paused", `Paused · ${paused.length}`], ["chapters", `Chapters · ${chapters.length}`]]
              .map(([k, l]) => `<button type="button" role="tab" aria-selected="${f === k}" class="${f === k ? "on" : ""}" data-action="goals-filter" data-val="${k}">${l}</button>`).join("")}
          </div>`;

        if (f === "paused") {
          return head + load + (paused.length ? `
            <div class="card enter" style="padding:4px 16px">${paused.map(goalRow).join("")}</div>
            ${omiNote("Paused goals never feed Today. Nothing is lost — resume any time from the goal.", "quiet")}`
            : `<div class="card enter"><p class="body" style="font-weight:600">Nothing paused</p>
               <p class="muted" style="margin-top:6px">Pause a goal when a season gets heavy — it keeps milestones and history.</p></div>`);
        }

        if (f === "chapters") {
          return head + load + `
            <p class="section-label">Completed chapters</p>
            ${chapters.length ? `<div class="card enter" style="padding:4px 16px">${chapters.map(goalRow).join("")}</div>`
              : `<div class="card enter"><p class="muted">Complete a goal to close its chapter here — with what it changed for you.</p></div>`}
            ${removed.length ? `
              <p class="section-label">Removed · restore within 30 days</p>
              <div class="card" style="padding:4px 16px">
                ${removed.map(g => `
                  <div class="goal-row" style="cursor:default">
                    ${ringHtml(g, "sm")}
                    <span><span class="caption">${g.area}</span><span class="gr-title">${esc(g.title)}</span><span class="gr-meta">${esc(g.removedNote || "Removed")}</span></span>
                    <button type="button" class="x-btn" data-action="restore-goal" data-goal="${g.id}">Restore</button>
                  </div>`).join("")}
              </div>` : ""}`;
        }

        const focusCard = focus ? (() => {
          const { cls, label } = healthMeta(focus);
          const na = nextAction(focus);
          return `
            <p class="section-label">Focus · gets Today priority</p>
            <div class="card enter" style="padding:18px">
              <button type="button" class="focus-goal" data-action="open-goal" data-goal="${focus.id}" aria-label="Open focus goal: ${esc(focus.title)}">
                <span class="fg-top">
                  ${ringHtml(focus, "lg")}
                  <span style="flex:1;min-width:0">
                    <span class="caption">${focus.area}</span>
                    <h3>${esc(focus.title)}</h3>
                    <span class="health-line ${cls}" style="display:block">${label}</span>
                    <span class="meta" style="display:block">Milestones ${msCount(focus)} · ${focus.sessions} sessions</span>
                  </span>
                  <span class="chev" aria-hidden="true">›</span>
                </span>
              </button>
              ${na ? `<div class="next-line"><span class="today-tag">${na.today === "must" ? "Today" : "Next"}</span>
                <span><span class="caption">Up next</span><strong>${esc(na.title)}</strong> · ~${na.minutes} min</span></div>` : ""}
            </div>`;
        })() : omiNote("No focus goal. Pick one so Today knows what to protect.", "think",
          live.slice(0, 3).map(g => `<button type="button" data-action="set-focus-quick" data-goal="${g.id}">${esc(shortTitle(g.title, 22))}</button>`).join(""));

        return head + load + focusCard + `
          ${others.length ? `<p class="section-label">Also active</p>
            <div class="card" style="padding:4px 16px">${others.map(goalRow).join("")}</div>` : ""}
          ${!live.length ? `<div class="card"><p class="body" style="font-weight:600">No active goals</p>
            <p class="muted" style="margin-top:6px">Resume a paused goal, or shape a new one.</p></div>` : ""}
          ${quiet ? omiNote(`<strong>${esc(quiet.title)}</strong> has been quiet — last +1 ${quiet.lastDone}. Make it tiny, or pause it so it stops weighing on you?`, "worry",
            `<button type="button" class="primary-att" data-action="goal-tiny" data-goal="${quiet.id}">Make it tiny</button>
             <button type="button" data-action="quick-pause" data-goal="${quiet.id}">Pause it</button>
             <button type="button" data-action="open-goal" data-goal="${quiet.id}">Open</button>`) : ""}
          ${live.length > 3 ? omiNote(`${live.length} active goals usually thin each other out. Pausing one keeps Today light.`, "worry", "", "warn") : ""}
          <button type="button" class="btn btn-primary" style="margin-top:8px" data-action="start-new-goal">Shape a new goal with Omi</button>
          <button type="button" class="btn btn-secondary" data-action="start-manual-goal">Write one myself</button>`;
      },

        if (g.status === "completed") return views["goal-chapter"]();
        const { cls, label } = healthMeta(g);
        const cur = currentMilestone(g);

        const isLive = g.status === "focus" || g.status === "active";
        return `

            `<button type="button" class="primary-att" data-action="resume-goal">Resume goal</button>`) : ""}

            <div><p class="caption">Why it matters</p><p class="body">${esc(g.why)}</p></div>
            <div><p class="caption">Rhythm</p><p class="body">${g.cadence} · ~${g.size} min · ${g.horizon}</p></div>
          </div>

          <p class="section-label">Milestones · ${msCount(g)}</p>
          <div class="card">
            ${g.milestones.length ? `<ol class="ms-list">
              ${g.milestones.map((m, i) => `
                <li class="ms-item ${m.done ? "done" : ""} ${m.current ? "current" : ""}">
                  <button type="button" class="ms-dot" data-action="toggle-ms" data-i="${i}" aria-pressed="${m.done}" aria-label="${m.done ? "Reopen" : "Mark reached"}: ${esc(m.t)}">${m.done ? "✓" : ""}</button>
                  <div>
                    <p class="ms-title">${esc(m.t)}</p>
                    <p class="meta">${m.current ? "Current · " : ""}${esc(m.when || "")}</p>
                  </div>
                </li>`).join("")}
            </ol>` : `<p class="muted">No milestones yet. Add 2–3 checkpoints in Edit — or let Omi suggest them.</p>`}
            ${allDone && isLive ? omiNote("Every milestone is reached. Ready to close this chapter?", "cheer",
              `<button type="button" class="primary-att" data-action="mark-goal-complete">Close chapter</button>`) : ""}
          </div>

          <p class="section-label">Actions · following this goal</p>
          <div class="card" style="padding:6px 16px 14px">
            <p class="muted" style="font-size:13px;padding-top:8px">When this goal leads, Omi picks one as Today's +1. Tap to edit.</p>
            ${g.actions.map(a => `
              <button type="button" class="act-row ${a.paused ? "paused" : ""}" data-action="open-action" data-act="${a.id}" aria-label="${esc(a.title)}, ${a.minutes} minutes, ${a.kind === "habit" ? "habit" : "candidate"}${a.today ? `, on Today as ${a.today}` : ""}">
                <span class="act-kind" aria-hidden="true">${a.kind === "habit" ? "↻" : "+1"}</span>
                <span>
                  <span class="a-title">${esc(a.title)}</span>
                  <span class="a-meta">~${a.minutes} min · ${esc(a.paused ? "Paused" : a.stat)}</span>
                </span>
                ${a.today ? `<span class="today-tag ${a.today === "should" ? "should" : ""}">${a.today === "must" ? "Must" : "Should"}</span>` : `<span class="chev" aria-hidden="true">›</span>`}
              </button>`).join("")}
            <button type="button" class="add-row" data-action="open-add-action"><span aria-hidden="true">+</span> Add action</button>
          </div>

          ${omiNote(esc(g.insight.omi), g.health === "quiet" ? "worry" : "spark")}

          ${g.status === "focus" ? `<button type="button" class="btn btn-primary" data-go="today">Go to Today Pack</button>`
            : g.status === "active" ? `<button type="button" class="btn btn-primary" data-action="open-focus">Make this my focus</button>` : ""}

          <p class="section-label">Manage</p>
          <div class="card manage-list">
            <button type="button" class="manage-row" data-action="open-edit"><span>Edit goal<small>Title, outcome, rhythm, milestones</small></span><span class="chev" aria-hidden="true">›</span></button>
            ${g.status === "paused"

      "omi-bond"() {

        const next = nextOmiForm(live);
        const rail = OMI_FORMS.map(f => {
          const unlocked = state.bondPoints >= f.needBond && activeGoalCount() >= f.needGoals;
          const isCurrent = f.id === live.id;
          const isShown = f.id === form.id;
          return `
            <button type="button" class="form-card ${isShown ? "current" : ""} ${unlocked ? "" : "locked"}" data-action="preview-form" data-form-id="${f.id}" aria-pressed="${isShown}">
              ${omiFaceSvg(isShown ? "proud" : "idle", 64, f)}
              <strong>${f.en}</strong>
              <span>${f.vi}</span>
              <span class="tag">${isCurrent ? "Now" : unlocked ? "Unlocked" : f.unlock}</span>
            </button>`;
        }).join("");
        const moodList = Object.entries(OMI_MOODS).map(([key, m]) => {
          const open = moodUnlocked(key, form);
          return `<button type="button" class="omi-mood-card ${open ? "" : "mood-lock"}" data-action="pick-mood" data-mood="${key}">

        const path = next ? `
          <div class="card">

                <span class="txt">Bond ${Math.min(state.bondPoints, next.needBond)} / ${next.needBond}<span>${bondOk ? "Reached" : `${next.needBond - state.bondPoints} to go · about ${Math.ceil((next.needBond - state.bondPoints) / 5)} days of +1 + reflect`}</span></span>
                ${bondOk ? "" : `<span class="go">Today's +1</span>`}
              </button>

            <p class="so-what">Omi grows with presence. <em>No shortcuts, no pay-to-skip.</em></p>

          <div class="enter">

            }[state.returnEnergy || "Okay"], state.returnEnergy === "Ready" ? "spark" : "listen")}
            <button type="button" class="btn btn-primary" data-action="comeback-start">Help me restart${state.comebackBonus ? "" : " · +2 Bond"}</button>
            <button type="button" class="btn btn-secondary" data-go="deepen">Tell Omi what happened</button>
            <button type="button" class="btn btn-tertiary" data-go="today">Just browse Today</button>
          </div>`;
      },

      "today-preview"() {
        state.step = "today";
        return views.today();
      }
    };

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function hasDayCheckin() {
      if (state.dayCheckinDone) return true;
      try {
        return sessionStorage.getItem("oneup-day-checkin") === todayKey();
      } catch {
        return false;
      }
    }

    function markDayCheckin() {
      state.dayCheckinDone = true;
      try {
        sessionStorage.setItem("oneup-day-checkin", todayKey());
      } catch { /* ignore */ }
    }

    function clearDayCheckin() {
      state.dayCheckinDone = false;
      try {
        sessionStorage.removeItem("oneup-day-checkin");
      } catch { /* ignore */ }
    }

    function daySheetMarkup() {
      const hour = new Date().getHours();
      const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
      return `
        <div class="day-sheet-handle" aria-hidden="true"></div>
        <div class="day-sheet-head">
          ${omiIllus("listen", { size: 56 })}
          <div>
            <p class="greet" style="margin:0">${greet}, ${state.name}</p>
            <h2 id="daySheetTitle">How’s your day?</h2>
            <p class="day-lead">One quick read — Omi sizes today’s +1. Not a second dashboard.</p>
          </div>
        </div>
        <p class="caption">Energy</p>
        ${chips(["Low","Okay","Good","High"], "energy", state.energy)}
        <p class="caption">Mood <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></p>
        ${chips(["Sad","Neutral","Good","Great"], "mood", state.mood)}
        <p class="caption">Available time</p>
        ${chips(["10 min","20 min","30 min","90 min","1 hour+"], "available", state.available)}
        <button type="button" class="btn btn-primary" data-action="apply-checkin">See today’s +1</button>
        <button type="button" class="btn btn-tertiary" data-action="skip-day-checkin">Skip for now</button>`;
    }

    function openDaySheet(force = false) {
      const scrim = $("dayScrim");
      const sheet = $("daySheet");
      if (!scrim || !sheet) return;
      if (!force && hasDayCheckin()) return;
      sheet.innerHTML = daySheetMarkup();
      scrim.hidden = false;
      sheet.hidden = false;
      state.daySheetOpen = true;
      requestAnimationFrame(() => {
        scrim.classList.add("open");
        sheet.classList.add("open");
      });
      updateOmiFloat();
      const first = sheet.querySelector(".chip, .btn-primary");
      if (first) first.focus({ preventScroll: true });
    }

    function closeDaySheet() {
      const scrim = $("dayScrim");
      const sheet = $("daySheet");
      if (!scrim || !sheet) return;
      state.daySheetOpen = false;
      scrim.classList.remove("open");
      sheet.classList.remove("open");
      const finish = () => {
        if (state.daySheetOpen) return;
        scrim.hidden = true;
        sheet.hidden = true;
        sheet.innerHTML = "";
      };
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) finish();
      else setTimeout(finish, 320);
      updateOmiFloat();
    }

    function maybeShowDaySheet() {
      if (state.step !== "today") return;
      if (hasDayCheckin()) return;
      openDaySheet();
    }

    function setTab(name) {
      tabbar.querySelectorAll(".tab").forEach(t => {
        const on = t.dataset.tab === name;
        t.classList.toggle("active", on);
        if (on) t.setAttribute("aria-current", "page");
        else t.removeAttribute("aria-current");
      });
      updateOmiFloat();
    }

    function render(step) {
      clearCountdown();
      clearFocusTimer();
      clearWgTimer();
      const fn = views[step];
      if (!fn) return;
      state.step = step;
      if (step !== "omi-bond") state.omiFormOverride = null;
      closeSheet(true);
      const needsTabs = ["today","checkin","goals","goal-detail","goal-insight","goal-chapter","progress","omi","omi-feelings","omi-bond","omi-evolve","ask","weekly","journey","change","countdown","execute","complete","reflect","learned","adapt","next-oneup","memory","skip","share","deepen","next-day","lost-progress","streak-good","goal-complete","recovery","milestone","plus-preview","widgets"].includes(step);
      if (needsTabs && step !== "welcome" && step !== "omi-hello" && step !== "priority" && step !== "why" && step !== "blocker" && step !== "time" && step !== "summary" && step !== "goal-start" && step !== "clarify" && step !== "approve") {
        tabbar.classList.remove("hidden");
        screen.classList.remove("no-tab");
      }
      if (["signin","welcome","omi-hello","priority","why","blocker","time","summary","goal-start","clarify","approve","plus", ...GOAL_COVER_STEPS].includes(step)) {
        tabbar.classList.add("hidden");
        screen.classList.add("no-tab");
      }
      screen.innerHTML = fn();
      if (step === "goal-new-draft" && !state.ng.draft) generateDraft();
      if (step === "execute") startFocusTimer();
      if (step === "widgets") startWgTimer();
      mountAuthSheet();
      const grow = screen.querySelectorAll("[data-w]");
      if (grow.length) {
        requestAnimationFrame(() => requestAnimationFrame(() => grow.forEach(el => { el.style.width = el.dataset.w + "%"; })));
      }
      screen.focus({ preventScroll: true });
      screen.scrollTop = 0;
      updateDesktop();
      updateOmiFloat();
      if (step === "countdown") startCountdown();
      if (state.step === "today") maybeShowDaySheet();
      else if (state.daySheetOpen) closeDaySheet();
      if (state.step === "omi-hello") {
        const name = $("name");
        if (name) {
          name.focus({ preventScroll: true });
          name.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") {
              ev.preventDefault();
              state.name = (name.value || "Alex").trim() || "Alex";
              render("priority");
            }
          }, { once: true });
        }
      }
    }

    let countdownHandle = null;

    function clearCountdown() {
      if (countdownHandle != null) {
        clearTimeout(countdownHandle);
        countdownHandle = null;
      }
    }

    function startCountdown() {
      clearCountdown();
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const beats = reduce ? ["Go"] : ["3", "2", "1", "Go"];
      const tickMs = reduce ? 450 : 800;
      let i = 0;

      function paint(label) {
        const num = $("countdownNum");
        const status = $("countdownStatus");
        const omiHost = $("countdownOmi");
        if (!num || !status) return;
        const isGo = label === "Go";
        num.textContent = label;
        num.classList.toggle("go", isGo);
        num.style.animation = "none";
        void num.offsetWidth;
        if (!reduce) num.style.animation = "";
        status.textContent = isGo ? "Go — begin your OneUp" : `Starting in ${label}`;
        if (omiHost) {
          const moodMap = { "3": "think", "2": "listen", "1": "spark", "Go": "celebrate" };
          omiHost.innerHTML = omiIllus(moodMap[label] || "think", { size: 120, label: false });
        }
      }

      paint(beats[0]);
      function advance() {
        i += 1;
        if (i >= beats.length) {
          countdownHandle = null;
          render("execute");
          return;
        }
        paint(beats[i]);
        countdownHandle = setTimeout(advance, tickMs);
      }
      countdownHandle = setTimeout(advance, tickMs);
    }

    function updateDesktop() {
      const panel = $("desktopPanel");
      if (!state.desktop) {
        panel.innerHTML = "";
        panel.setAttribute("aria-hidden", "true");
        return;
      }
      panel.setAttribute("aria-hidden", "false");
      const focus = state.goals.find(g => g.status === "focus");
      panel.innerHTML = `
        <div class="card">
          <p class="caption">Today Pack</p>
          <p class="body" style="font-weight:600;margin:8px 0">Must · ${state.oneup.title}</p>
          <p class="muted">${state.available} · ${state.energy}</p>
          <hr style="border:0;border-top:1px solid var(--border);margin:16px 0" />
          <p class="caption">Focus goal</p>
          <p class="body">${focus ? focus.title : "—"}</p>
          <p class="caption" style="margin-top:12px">Omi role</p>
          <p class="muted">Think / adapt / memory — not a second Today.</p>
        </div>`;
    }

    function applyCheckin() {
      if (state.energy === "Low" || state.available === "10 min" || state.available === "20 min") {
        state.adapted = true;
        state.oneup = {
          area: "English",
          title: "Speak for 10 minutes about today's work",
          minutes: 10,
          why: "Lower capacity — shorter speaking still protects your focus goal. Supporting trimmed.",
          steps: [
            "Pick one topic from today",
            "Speak for 10 minutes",
            "Stop when the timer ends — enough"
          ]
        };
        state.supporting = [
          { id: "s1", area: "Health", title: "Walk 10 minutes (moved from ritual)", minutes: 10, done: false }
        ];
        state.rituals = [];
      } else if (state.available === "90 min" || state.available === "1 hour+") {
        state.adapted = false;
        state.oneup = {
          area: "English",
          title: "Speak about today's work for 20 minutes",
          minutes: 20,
          why: "English is this week's focus — and you've skipped it twice. Twenty minutes fits your window.",
          steps: [
            "Pick one work topic from today",
            "Speak continuously for 15–20 minutes",
            "Note 2 phrases for your next meeting"
          ]
        };
        state.supporting = [
          { id: "s1", area: "Creator", title: "Ship one OneUp UI polish", minutes: 45, done: false },
          { id: "s2", area: "Career", title: "Skim EM promo checklist (10 min)", minutes: 10, done: false }
        ];
        state.rituals = [{ id: "r1", title: "Walk 10 min", done: false }];
      } else {
        state.adapted = false;
        state.supporting = state.supporting.slice(0, 1);
      }
      markDayCheckin();
      closeDaySheet();
      render("today");
    }

    const NG_KEYS = { ngArea: "area", ngWhy: "whyNow", ngTime: "time", ngHorizon: "horizon" };
    const GE_KEYS = { geArea: "area", geCadence: "cadence", geSize: "size", geHorizon: "horizon" };

    function handleGoalChip(t) {
      const key = t.dataset.key;
      const val = t.dataset.val;
      if (key === "ngIdea") {
        captureNewGoalText();
        state.ng.text = val;
        state.ng.titleOverride = "";
        render(state.step);
        return true;
      }
      if (NG_KEYS[key]) {
        captureNewGoalText();
        state.ng[NG_KEYS[key]] = val;
        if (key === "ngArea") {
          state.ng.titleOverride = "";
          render(state.step);
          return true;
        }
      }
      if (GE_KEYS[key] && state.ge) {
        state.ge[GE_KEYS[key]] = key === "geSize" ? parseInt(val, 10) : val;
      }
      return false;
    }

    const GOAL_ACTIONS = {
      "close-sheet": () => closeSheet(),
      "open-goal": (t) => {
        state.goalId = t.dataset.goal;
        render(goalById().status === "completed" ? "goal-chapter" : "goal-detail");
      },
      "open-insight": (t) => { state.goalId = t.dataset.goal; render("goal-insight"); },
      "goals-filter": (t) => { state.goalsFilter = t.dataset.val; render("goals"); },
      "show-chapters": () => { state.goalsFilter = "chapters"; render("goals"); },
      "new-goal-menu": () => openSheet(sheetNewGoalMenu()),
      "start-new-goal": () => { state.ng = freshNewGoal(); render("goal-new"); },
      "start-manual-goal": () => { state.ng = freshNewGoal(); state.ng.manual = true; render("goal-new-manual"); },
      "exit-new-goal": () => render("goals"),
      "seed-goals": () => {
        state.goals = seedGoals();
        state.goalsFilter = "active";
        render("goals");
        showToast("Starter goals added — edit or pause any of them.");
      },
      "demo-empty-goals": () => { state.goals = []; state.goalsFilter = "active"; render("goals"); },

      // New goal rail
      "ng-continue": () => { captureNewGoalText(); render("goal-new-shape"); },
      "ng-draft": () => { state.ng.variant = state.ng.evolve ? "bigger" : "base"; state.ng.draft = null; render("goal-new-draft"); },
      "ng-tweak": (t) => { captureDraft(); state.ng.variant = t.dataset.val; state.ng.draft = null; render("goal-new-draft"); },
      "ng-toggle": (t) => {
        captureDraft();
        const item = state.ng.draft[t.dataset.list][Number(t.dataset.i)];
        item.on = !item.on;
        render("goal-new-draft");
      },
      "ng-restart": () => { state.ng = freshNewGoal(); render("goal-new"); },
      "ng-accept-draft": () => {
        captureDraft();
        if (!state.ng.draft.title.trim()) {
          showToast("Give the goal a title first");
          $("ngTitle")?.focus();
          return;
        }
        render("goal-new-place");
      },
      "ng-place": (t) => { state.ng.placement = t.dataset.val; render("goal-new-place"); },
      "ng-toggle-pause": (t) => {
        const ids = state.ng.pauseIds;
        const i = ids.indexOf(t.dataset.goal);
        if (i >= 0) ids.splice(i, 1); else ids.push(t.dataset.goal);
        render("goal-new-place");
      },
      "ng-approve": () => {
        const ng = state.ng;
        const goal = newGoalFromDraft(ng);
        const toPause = ng.placement === "focus" ? liveGoals() : liveGoals().filter(g => ng.pauseIds.includes(g.id));
        toPause.forEach(g => pauseGoal(g, ng.placement === "focus" ? "Paused for new focus" : "Paused to make room"));
        state.goals.unshift(goal);
        state.goalId = goal.id;
        state.goalsFilter = "active";
        const leveled = addBond(10, "New goal");
        render("goal-new-done");
        if (leveled) setTimeout(() => render("omi-evolve"), 1800);
      },
      "ng-add-today": () => {
        const g = goalById();
        const a = g.actions.find(x => x.kind === "candidate") || g.actions[0];
        if (a && !state.supporting.some(s => s.id === a.id)) {
          state.supporting.push({ id: a.id, area: g.area, title: a.title, minutes: a.minutes, done: false });
          a.today = "should";
        }
        render("today");
        showToast("Added to Today as Should — optional");
      },
      "nm-save": () => {
        captureNewGoalText();
        if (!state.ng.text) {
          showToast("Add a goal title first");
          $("nmTitle")?.focus();
          return;
        }
        state.ng.draft = buildManualDraft();
        render("goal-new-place");
      },
      "nm-ask-omi": () => {
        captureNewGoalText();
        state.ng.titleOverride = capitalize(state.ng.text);
        state.ng.draft = null;
        render("goal-new-draft");
      },

      // Detail · milestones
      "toggle-ms": (t) => {

        m.done = !m.done;
        refreshCurrent(g);
        render("goal-detail");
        showToast(m.done ? `Milestone reached · ${shortTitle(m.t, 26)}` : "Milestone reopened", () => {
          m.done = !m.done;
          refreshCurrent(g);
          render("goal-detail");
        });
      },

      // Detail · actions
      "open-action": (t) => openSheet(sheetAction(goalById(), t.dataset.act)),
      "ga-save": (t) => {
        const g = goalById();
        const a = g.actions.find(x => x.id === t.dataset.act);
        const title = ($("gaTitle")?.value || "").trim();
        if (!title) { showToast("Action needs a title"); return; }
        a.title = title;
        a.minutes = parseInt(state.gaMin, 10) || a.minutes;
        a.kind = state.gaKind === "Habit" ? "habit" : "candidate";
        const sup = state.supporting.find(s => s.id === a.id);
        if (sup) { sup.title = a.title; sup.minutes = a.minutes; }
        render("goal-detail");
        showToast("Action saved");
      },
      "ga-today": (t) => {
        const g = goalById();
        const a = g.actions.find(x => x.id === t.dataset.act);
        if (!state.supporting.some(s => s.id === a.id)) {
          state.supporting.push({ id: a.id, area: g.area, title: a.title, minutes: a.minutes, done: false });
        }
        a.today = "should";
        a.paused = false;
        render("goal-detail");
        showToast("On Today as Should — optional");
      },
      "ga-pause": (t) => {
        const g = goalById();
        const a = g.actions.find(x => x.id === t.dataset.act);
        a.paused = !a.paused;
        render("goal-detail");
        showToast(a.paused ? "Action paused — Omi won't pick it" : "Action back in rotation");
      },
      "ga-remove": (t) => {
        const g = goalById();
        const idx = g.actions.findIndex(x => x.id === t.dataset.act);
        const [removed] = g.actions.splice(idx, 1);
        const supIdx = state.supporting.findIndex(s => s.id === removed.id);
        const [sup] = supIdx >= 0 ? state.supporting.splice(supIdx, 1) : [];
        render("goal-detail");
        showToast(`Removed “${shortTitle(removed.title, 24)}”`, () => {
          g.actions.splice(idx, 0, removed);
          if (sup) state.supporting.splice(supIdx, 0, sup);
          render("goal-detail");
        });
      },
      "open-add-action": () => openSheet(sheetAddAction(goalById())),
      "ga-suggest": (t) => {
        const f = $("gaNewTitle");
        if (f) f.value = t.dataset.val;
        state.gaMin = `${t.dataset.min} min`;
        document.querySelectorAll('[data-key="gaMin"]').forEach(c => c.classList.toggle("selected", c.dataset.val === state.gaMin));
        document.querySelectorAll('[data-action="ga-suggest"]').forEach(c => c.classList.toggle("selected", c === t));
      },

        if (!title) { showToast("Pick a suggestion or write one"); $("gaNewTitle")?.focus(); return; }
        const g = goalById();
        g.actions.push({ id: "n" + Date.now().toString(36), title, minutes: parseInt(state.gaMin, 10) || 10, kind: "candidate", stat: "New · Omi can pick it" });
        render("goal-detail");
        showToast("Action added");
      },

      "open-focus": () => openSheet(sheetFocus(goalById())),

      "gf-confirm": () => {

        g.status = "focus";
        render(state.step === "goals" ? "goals" : "goal-detail");
        showToast("Focus set — Today leans here from tomorrow");
      },
      "open-pause": () => {
        state.gpWhy = "Busy season";
        state.gpWhen = "In 2 weeks";
        openSheet(sheetPause(goalById()));
      },
      "quick-pause": (t) => { state.goalId = t.dataset.goal; GOAL_ACTIONS["open-pause"](); },
      "gp-confirm": () => {
        const g = goalById();
        const wasFocus = g.status === "focus";
        pauseGoal(g, `${state.gpWhy} · check back ${String(state.gpWhen).toLowerCase()}`);
        let promoted = null;
        if (wasFocus) {
          promoted = liveGoals().find(x => x.title === state.gpNext) || liveGoals()[0] || null;
          if (promoted) promoted.status = "focus";
        }
        state.supporting = state.supporting.filter(s => !g.actions.some(a => a.id === s.id));
        const back = state.step;
        render(back === "goals" ? "goals" : "goal-detail");
        showToast(promoted ? `Paused · ${shortTitle(promoted.title, 20)} is focus now` : "Goal paused — it won't feed Today", () => {
          g.status = g.prev.status;
          g.health = g.prev.health;
          if (promoted) promoted.status = "active";
          render(back === "goals" ? "goals" : "goal-detail");

        showToast("Made tiny — 10-min asks for two weeks");
      },

      "gr-confirm": () => {

        state.goalsFilter = "active";
        render("goals");
        showToast(`Removed “${shortTitle(g.title, 22)}”`, () => {

          state.supporting = supBefore;

        g.status = "active";
        g.health = "steady";
        g.completedNote = "";
        state.goalsFilter = "active";
        render("goal-detail");
        showToast("Chapter reopened");
      },

      "mark-goal-complete": () => { state.gcChoice = "done"; state.gcKeep = true; render("goal-complete-check"); },
      "gc-choice": (t) => { state.gcChoice = t.dataset.val; render("goal-complete-check"); },
      "gc-keep": () => { state.gcKeep = !state.gcKeep; render("goal-complete-check"); },
      "gc-confirm": () => {
        const g = goalById();
        const choice = state.gcChoice || "done";

          render("goal-detail");

        const wasFocus = g.status === "focus";
        const habit = g.actions.find(a => a.kind === "habit");
        const keep = state.gcKeep && habit;
        g.status = "completed";
        g.health = "chapter";
        g.progress = 100;
        g.changed = state.goalChange || g.changed;
        g.completedNote = `Completed today${keep ? " · kept as ritual" : ""}`;
        if (keep && !state.rituals.some(r => r.title === habit.title)) {
          state.rituals.push({ id: "r" + Date.now().toString(36), title: habit.title, done: false });

        state.supporting = state.supporting.filter(s => !g.actions.some(a => a.id === s.id));

          const next = liveGoals()[0];
          if (next) next.status = "focus";
        }
        const leveled = addBond(20, "Goal complete");

      if (t.dataset.action && GOAL_ACTIONS[t.dataset.action]) {

        return;

      if (t.dataset.action && PLUS_ACTIONS[t.dataset.action]) {

      if (t.dataset.toggleSup) {

        render("today");
        return;

      if (t.dataset.toggleRitual) {
        const item = state.rituals.find(r => r.id === t.dataset.toggleRitual);
        if (item) item.done = !item.done;
        render("today");
        return;

          document.querySelectorAll(`[data-key="askTopic"]`).forEach(c => c.classList.toggle("selected", c === t));
          const topic = t.dataset.val;
          const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const wait = reduce ? 480 : 3000;
          runAskThinking(wait).then(() => {
            if (state.step !== "ask") return;
            const map = {

              "What should I focus on today?": "think",
              "Why am I not progressing?": "spark",
              "I feel overwhelmed": "quiet",
              "Change my plan": "listen",

        if (["lostWhy", "lostHelp", "returnEnergy"].includes(t.dataset.key)) {

          rerender();

        const delay = reduce ? 0 : 200;

          return;

    (function bindOmiFloat() {
      const btn = $("omiFloat");
      if (!btn) return;
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let origLeft = 0;
      let origTop = 0;
      let lastTap = 0;

      btn.addEventListener("pointerdown", (e) => {
        if (e.button != null && e.button !== 0) return;
        dragging = true;
        moved = false;
        btn.classList.add("dragging");
        btn.setPointerCapture(e.pointerId);
        const rect = btn.getBoundingClientRect();
        const phone = document.querySelector(".phone").getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origLeft = rect.left - phone.left;
        origTop = rect.top - phone.top;
      });

      btn.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.hypot(dx, dy) > 8) moved = true;
        if (!moved) return;
        const phone = document.querySelector(".phone");
        const pad = 12;
        const tabH = tabbar.classList.contains("hidden") ? 16 : 96;
        const size = 56;
        let left = origLeft + dx;
        let top = origTop + dy;
        left = Math.min(Math.max(pad, left), phone.clientWidth - size - pad);
        top = Math.min(Math.max(pad + 40, top), phone.clientHeight - size - tabH - pad);
        state.omiFloat.x = left;
        state.omiFloat.y = top;
        btn.style.left = `${left}px`;
        btn.style.top = `${top}px`;
        btn.style.right = "auto";
        btn.style.bottom = "auto";
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        btn.classList.remove("dragging");
        try { btn.releasePointerCapture(e.pointerId); } catch (_) {}
        if (moved) {
          const left = parseFloat(btn.style.left) || 0;
          const top = parseFloat(btn.style.top) || 0;
          snapOmiFloat(left, top);
          return;
        }
        const now = Date.now();
        if (now - lastTap < 350) {
          resetOmiFloat();
          lastTap = 0;
          return;
        }
        lastTap = now;
        render("omi");
      }

      btn.addEventListener("pointerup", endDrag);
      btn.addEventListener("pointercancel", endDrag);

      btn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          render("omi");
        }
        if (e.key === "r" || e.key === "R") {
          e.preventDefault();
          resetOmiFloat();
        }
        // Arrow keys move between corners (drag alternative)
        const order = ["tl", "tr", "br", "bl"];
        if (e.key.startsWith("Arrow")) {
          e.preventDefault();
          let i = order.indexOf(state.omiFloat.corner || "br");
          if (e.key === "ArrowLeft") i = (i + 3) % 4;
          if (e.key === "ArrowRight") i = (i + 1) % 4;
          if (e.key === "ArrowUp") i = (i + 2) % 4;
          if (e.key === "ArrowDown") i = (i + 2) % 4;
          state.omiFloat.corner = order[i];
          state.omiFloat.x = null;
          state.omiFloat.y = null;
          applyOmiFloatPosition();
        }
      });
    })();

    function runAskThinking(ms = 3000, hostId = "askReply") {
      stopAskThinking();

      host.innerHTML = askThinkingHtml();
      host.setAttribute("aria-busy", "true");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      runAskThinking._beat = 0;
      applyAskBeat(0);
      if (!reduce) {

          resolve();

      const el = $("ouLoad");

      clearTimeout(hideLoading._t);
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      hideLoading._t = setTimeout(() => {
        el.hidden = true;
        el.classList.remove("exit");
      }, reduce ? 40 : 220);
    }

    function endBoot(goWelcome = true) {
      const boot = $("boot");
      if (!boot || boot.hidden) {
        if (goWelcome && state.step === "welcome" && !screen.innerHTML) render("welcome");
        return;
      }
      clearTimeout(runBoot._t1);
      clearTimeout(runBoot._t2);
      clearTimeout(runBoot._beat1);
      clearTimeout(runBoot._beat2);
      boot.classList.add("exit");
      boot.style.pointerEvents = "none";
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const fade = reduce ? 40 : 320;
      runBoot._t2 = setTimeout(() => {
        boot.hidden = true;
        boot.setAttribute("aria-hidden", "true");
        boot.classList.remove("boot-play", "exit");
        boot.style.pointerEvents = "";
        if (goWelcome) render(state.signedIn ? "welcome" : "signin");
      }, fade);
    }

    function runBoot() {
      const boot = $("boot");
      if (!boot) {
        render("welcome");
        return;
      }
      hideLoading();
      const beat = $("bootBeat");
      if (beat) beat.textContent = "Listen";
      boot.hidden = false;
      boot.classList.remove("exit", "boot-play");
      boot.setAttribute("aria-hidden", "false");
      boot.style.pointerEvents = "";
      void boot.offsetWidth;
      boot.classList.add("boot-play");

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      clearTimeout(runBoot._t1);
      clearTimeout(runBoot._t2);
      clearTimeout(runBoot._beat1);
      clearTimeout(runBoot._beat2);
      clearTimeout(runBoot._safety);

      if (!reduce) {
        runBoot._beat1 = setTimeout(() => {
          if (beat && !boot.hidden) beat.textContent = "Understand";
        }, 900);
        runBoot._beat2 = setTimeout(() => {
          if (beat && !boot.hidden) beat.textContent = "Your +1";
        }, 1750);
      } else if (beat) {
        beat.textContent = "Your next +1";
      }

      const hold = reduce ? 520 : 3200;
      runBoot._t1 = setTimeout(() => endBoot(true), hold);
      runBoot._safety = setTimeout(() => {
        if (boot && !boot.hidden) endBoot(true);
      }, hold + 1400);
    }

    runBoot();
  </script>
</body>
</html>
