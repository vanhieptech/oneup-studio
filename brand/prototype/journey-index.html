<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OneUp — Today Pack + Omi Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F7F5;
      --surface: #FFFFFF;
      --ink: #111111;
      --muted: #6B6B6B;
      --border: #E8E8E6;
      --primary: #111111;
      --primary-press: #2A2A2A;
      --on-primary: #FFFFFF;
      --accent: #111111;
      --coach: #F4F4F2;
      --momentum: #B45309;
      --success: #1A7F4B;
      --danger: #B91C1C;
      --soft: #F0F0EE;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 10px 28px rgba(17, 17, 17, 0.05);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --phone-w: 390px;
      --phone-h: 844px;
    }
    /* TOK-01 §1.6 / brand/COLOR.md dark ramp (paper-on-ink). Light is default;
       chrome "Dark" toggle sets html[data-theme="dark"] for side-by-side review. */
    :root[data-theme="dark"] {
      --bg: #111111;
      --surface: #1C1C1A;
      --ink: #F7F7F5;
      --muted: #A3A3A0;
      --border: #2E2E2C;
      --primary: #F7F7F5;
      --primary-press: #E8E8E6;
      --on-primary: #111111;
      --accent: #F7F7F5;
      --coach: #1A1A18;
      --soft: #242422;
      --success: #2F9E66;
      --momentum: #D97706;
      --danger: #DC2626;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
    :root[data-theme="dark"] body { background: #0A0A09; }
    :root[data-theme="dark"] .ou-load { background: rgba(17, 17, 17, 0.92); }
    :root[data-theme="dark"] .ghost { background: rgba(28, 28, 26, 0.8); }
    :root[data-theme="dark"] .tabbar {
      background: rgba(28, 28, 26, 0.72);
      border-color: rgba(46, 46, 44, 0.9);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.45);
    }
    :root[data-theme="dark"] .tab-primary { border-color: rgba(17, 17, 17, 0.95); }
    :root[data-theme="dark"] .card { border-color: var(--border); }
    :root[data-theme="dark"] .supporting { background: rgba(28, 28, 26, 0.72); }
    :root[data-theme="dark"] .dot.miss { background: var(--soft); }
    :root[data-theme="dark"] .energy-cell.mid { background: #3A3A37; }
    :root[data-theme="dark"] .banner { background: #2A1F0E; border-color: #5C4213; color: #F5C77A; }
    :root[data-theme="dark"] .success-mark { background: #12281C; }
    :root[data-theme="dark"] .phone { box-shadow: 0 0 0 1px #2E2E2C, 0 20px 60px rgba(0,0,0,0.5); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at 0% 0%, #ECECE8 0%, transparent 55%),
        #E4E4E0;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* App init — Pair Bond story (listen → understand → +1) */
    .boot {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 24px;
      transition: opacity 400ms ease;
    }
    .boot.exit {
      opacity: 0;
      pointer-events: none;
    }
    .boot[hidden] {
      display: none !important;
    }
    .boot-beat {
      min-height: 18px;
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
    }
    .boot.boot-play .boot-beat {
      animation: bootBeatIn 320ms ease-out 80ms forwards;
    }
    .boot-skip {
      position: absolute;
      bottom: calc(18px + var(--safe-b));
      left: 50%;
      transform: translateX(-50%);
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 10px 14px;
      min-height: 44px;
      cursor: pointer;
      opacity: 0;
    }
    .boot.boot-play .boot-skip {
      animation: bootRise 360ms ease-out 900ms forwards;
    }
    .boot-logo {
      width: 128px;
      height: 128px;
      color: var(--ink);
      opacity: 1;
    }
    .boot-pair {
      width: 100%;
      height: 100%;
      display: block;
    }
    .boot-pair .arc,
    .boot-pair .plus path {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }
    .boot-pair .arc { stroke-width: 4; }
    .boot-pair .plus path { stroke-width: 5; }
    .boot-pair .dot {
      fill: currentColor;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(0.4);
    }
    .boot.boot-play .boot-pair .arc {
      animation: bootDraw 780ms cubic-bezier(0.22, 1, 0.36, 1) 60ms forwards;
    }
    .boot.boot-play .boot-pair .dot-a {
      animation: bootDot 420ms cubic-bezier(0.22, 1, 0.36, 1) 720ms forwards;
    }
    .boot.boot-play .boot-pair .dot-b {
      animation: bootDot 420ms cubic-bezier(0.22, 1, 0.36, 1) 860ms forwards;
    }
    .boot.boot-play .boot-pair .plus .p1 {
      animation: bootDraw 480ms cubic-bezier(0.22, 1, 0.36, 1) 1120ms forwards;
    }
    .boot.boot-play .boot-pair .plus .p2 {
      animation: bootDraw 520ms cubic-bezier(0.22, 1, 0.36, 1) 1280ms forwards;
    }
    .boot.boot-play .boot-pair .plus .p3 {
      animation: bootDraw 360ms cubic-bezier(0.22, 1, 0.36, 1) 1560ms forwards;
    }
    .boot-brand {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.045em;
      opacity: 0;
      transform: translateY(8px);
    }
    .boot.boot-play .boot-brand {
      animation: bootRise 520ms cubic-bezier(0.22, 1, 0.36, 1) 1880ms forwards;
    }
    .boot-brand span { color: var(--muted); }
    .boot-tag {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      opacity: 0;
      transform: translateY(6px);
    }
    .boot.boot-play .boot-tag {
      animation: bootRise 480ms ease-out 2180ms forwards;
    }
    @keyframes bootDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes bootDot {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes bootRise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bootBeatIn {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot.boot-play .boot-beat,
      .boot.boot-play .boot-brand,
      .boot.boot-play .boot-tag,
      .boot.boot-play .boot-skip,
      .boot.boot-play .boot-pair .arc,
      .boot.boot-play .boot-pair .dot,
      .boot.boot-play .boot-pair .plus path {
        animation: none;
        opacity: 1;
        transform: none;
        stroke-dashoffset: 0;
      }
    }

    /* Loading — Seed Omi listen + soft waves (matches omi-exports) */
    .ou-load {
      position: absolute;
      inset: 0;
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(247, 247, 245, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 220ms ease;
    }
    .ou-load[hidden] { display: none !important; }
    .ou-load.exit {
      opacity: 0;
      pointer-events: none;
    }
    .ou-load-mark {
      width: 104px;
      height: 104px;
      color: var(--ink);
    }
    .ou-load-mark svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .ou-load-mark .omi {
      transform-origin: 32px 32px;
      animation: ouBreathe 2s ease-in-out infinite;
    }
    .ou-load-mark .ring {
      transform-origin: 32px 32px;
    }
    .ou-load-mark .r1 {
      animation: ouOrbit 2.6s linear infinite;
    }
    .ou-load-mark .r2 {
      animation: ouOrbitRev 3.8s linear infinite;
    }
    .ou-load-mark .eye-l {
      transform-origin: 25px 30px;
      animation: ouBlink 3.6s ease-in-out infinite;
    }
    .ou-load-mark .eye-r {
      transform-origin: 39px 30px;
      animation: ouBlink 3.6s ease-in-out 0.04s infinite;
    }
    .ou-load-mark .smile {
      transform-origin: 32px 38px;
      animation: ouSmile 2s ease-in-out infinite;
    }
    .ou-load-mark .mouth-flat { display: none; }
    .ou-load-mark[data-mood="listen"] .smile { display: none; }
    .ou-load-mark[data-mood="listen"] .mouth-flat { display: block; }
    .ou-load-mark .extra { display: none; }
    .ou-load-mark[data-mood="think"] .extra-think { display: block; }
    .ou-load-mark[data-mood="spark"] .extra-spark { display: block; }
    .ou-load-mark[data-mood="listen"] .extra-listen { display: block; }
    .ou-load-mark .think-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: ouThinkDot 1.2s ease-in-out infinite;
    }
    .ou-load-mark .td2 { animation-delay: 0.15s; }
    .ou-load-mark .td3 { animation-delay: 0.3s; }
    .ou-load-mark .sparkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: ouSparkle 1.4s ease-in-out infinite;
    }
    .ou-load-mark .sp2 { animation-delay: 0.2s; }
    .ou-load-mark .sp3 { animation-delay: 0.4s; }
    .ou-load-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      padding: 0 16px;
    }
    .ou-load-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin: 0;
      transition: opacity 180ms ease;
    }
    .ou-load-detail {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin: 0;
      text-align: center;
      max-width: 240px;
      transition: opacity 180ms ease;
    }
    .ou-load-copy.swap .ou-load-label,
    .ou-load-copy.swap .ou-load-detail {
      opacity: 0;
    }
    .ou-load-inline {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 48px 20px;
      min-height: 200px;
    }
    .ou-load-inline .ou-load-mark { width: 84px; height: 84px; }
    .ou-skel {
      border-radius: 12px;
      background: linear-gradient(90deg, var(--soft) 0%, #E8E8E6 50%, var(--soft) 100%);
      background-size: 200% 100%;
      animation: ouShimmer 1.2s ease-in-out infinite;
    }
    .ou-skel-line { height: 12px; margin: 8px 0; }
    .ou-skel-title { height: 22px; width: 70%; margin-bottom: 16px; }
    .ou-skel-card { height: 120px; width: 100%; border-radius: 16px; }
    @keyframes ouBreathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.04); }
    }
    @keyframes ouOrbit {
      to { transform: rotate(360deg); }
    }
    @keyframes ouOrbitRev {
      to { transform: rotate(-360deg); }
    }
    @keyframes ouBlink {
      0%, 42%, 48%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(0.12); }
    }
    @keyframes ouSmile {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(1.06); }
    }
    @keyframes ouThinkDot {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); }
    }
    @keyframes ouSparkle {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes ouShimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ou-load-mark .omi,
      .ou-load-mark .ring,
      .ou-load-mark .eye-l,
      .ou-load-mark .eye-r,
      .ou-load-mark .smile,
      .ou-load-mark .think-dot,
      .ou-load-mark .sparkle {
        animation: none;
      }
      .ou-load-mark .r1 { opacity: 0.4; }
      .ou-load-mark .r2 { opacity: 0.25; }
      .ou-skel { animation: none; background: var(--soft); }
    }

    /* Onboard rail — progress + escape hatches */
    .onboard-chrome {
      position: sticky;
      top: 0;
      z-index: 2;
      background: linear-gradient(var(--bg) 70%, transparent);
      padding: 0 0 12px;
      margin: 0 0 8px;
    }
    .onboard-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 36px;
    }
    .linkish {
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 8px 4px;
      min-height: 36px;
      cursor: pointer;
    }
    .linkish:hover { color: var(--ink); }
    .onboard-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .onboard-track {
      height: 3px;
      border-radius: 999px;
      background: var(--soft);
      margin-top: 8px;
      overflow: hidden;
    }
    .onboard-track > span {
      display: block;
      height: 100%;
      background: var(--ink);
      border-radius: inherit;
      transition: width 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .demo-fold {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .demo-fold summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      list-style: none;
      padding: 8px 0;
    }
    .demo-fold summary::-webkit-details-marker { display: none; }
    .demo-fold[open] summary { color: var(--ink); }
    .welcome-ctas { display: flex; flex-direction: column; gap: 10px; margin-top: 40px; }

    .stage {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px 32px;
    }

    .chrome-bar {
      width: min(100%, var(--phone-w));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .chrome-bar h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .chrome-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .ghost {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.7);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      min-height: 36px;
    }
    .ghost:hover { background: var(--surface); }
    .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .phone {
      width: min(100%, var(--phone-w));
      height: min(92vh, var(--phone-h));
      background: var(--bg);
      border-radius: 36px;
      box-shadow: var(--shadow), 0 0 0 1px rgba(15,23,42,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (max-width: 480px) {
      .stage { padding: 0; justify-content: stretch; }
      .chrome-bar { display: none; }
      .phone {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .status {
      height: 48px;
      padding: 14px 24px 0;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      flex-shrink: 0;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 8px 20px calc(108px + var(--safe-b));
      scroll-behavior: smooth;
    }
    .screen.no-tab { padding-bottom: calc(28px + var(--safe-b)); }

    /* Floating glass dock — modern chrome, +1 orb is the hero */
    .tabbar {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(14px + var(--safe-b));
      z-index: 10;
      padding: 8px 8px 10px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(22px) saturate(1.35);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
      border: 1px solid rgba(232, 232, 230, 0.85);
      border-radius: 28px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 10px 36px rgba(17, 17, 17, 0.12),
        0 2px 8px rgba(17, 17, 17, 0.04);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 4px;
      align-items: end;
    }
    .tabbar.hidden { display: none; }
    .tab {
      border: 0;
      background: transparent;
      font: inherit;
      color: var(--muted);
      padding: 0;
      min-height: 48px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-radius: 18px;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      transition:
        color 180ms cubic-bezier(0.22, 1, 0.36, 1),
        background 180ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 200ms ease;
    }
    .tab:active { transform: scale(0.94); }
    .tab svg {
      width: 22px;
      height: 22px;
      opacity: 0.72;
      transition: opacity 180ms ease, transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tab-side {
      width: 100%;
      min-width: 64px;
      padding: 8px 6px 6px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .tab-side .tab-caption {
      max-width: 72px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      opacity: 0.55;
      transform: translateY(1px);
      transition: opacity 180ms ease, font-weight 180ms ease, color 180ms ease;
    }
    .tab-side.active {
      color: var(--ink);
    }
    .tab-side.active::before {
      content: "";
      position: absolute;
      inset: 4px 8px;
      border-radius: 16px;
      background: var(--soft);
      z-index: -1;
    }
    .tab-side.active svg {
      opacity: 1;
      transform: translateY(-1px);
    }
    .tab-side.active .tab-caption {
      opacity: 1;
      font-weight: 600;
      color: var(--ink);
    }
    /* +1 orb — one destination, one gesture */
    .tab-primary {
      width: 64px;
      height: 64px;
      margin: -26px 4px 2px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--on-primary);
      border: 3px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 10px 28px rgba(17, 17, 17, 0.28),
        0 2px 0 rgba(255, 255, 255, 0.12) inset;
      gap: 0;
      min-height: 64px;
    }
    .tab-primary .plus-mark {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.08em;
      line-height: 1;
    }
    .tab-primary .tab-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .tab-primary:not(.active) {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--border);
      box-shadow:
        0 6px 18px rgba(17, 17, 17, 0.1),
        0 1px 0 rgba(255, 255, 255, 0.8) inset;
    }
    .tab-primary:not(.active) .plus-mark { opacity: 0.9; }
    .tab-primary.active {
      transform: translateY(-2px);
    }
    .tab-primary.active:active { transform: translateY(-2px) scale(0.94); }
    .tab-primary:not(.active):hover {
      border-color: var(--ink);
    }
    .tab:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      .tab, .tab-primary.active, .tab svg, .tab-side .tab-caption {
        transition: none;
        transform: none;
      }
    }

    /* Floating Omi — companion entry (not a 4th tab) */
    .omi-float {
      position: absolute;
      z-index: 12;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(17,17,17,0.12);
      display: grid;
      place-items: center;
      padding: 0;
      cursor: grab;
      touch-action: none;
      color: var(--ink);
      right: 18px;

    .ms-list { list-style: none; margin: 8px 0 0; padding: 0; position: relative; }

    .ms-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);

      place-items: center;

    .ms-item .ms-title { font-size: 15px; font-weight: 600; line-height: 1.35; }
    .ms-item.done .ms-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); }

    .today-tag {

    .add-row {

    .manage-list { padding: 4px 16px; }

      width: 100%;

      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      border: 0;

    .manage-row.danger { color: var(--danger); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid currentColor;
      margin-top: 8px;
    }

    .place-card {
      width: 100%;
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 12px;
      text-align: left;
      font: inherit;

    .draft-block { padding: 14px 0; border-bottom: 1px solid var(--border); }

    .field.inline {

      font-weight: 600;

    .x-btn {
      min-width: 44px;

      font-weight: 600;

    .omi-note {
      display: flex;

      align-items: flex-start;

      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.45;
    }
    /* Face scale locked with OmiFaceMetrics.note / DESIGN-TO-CODE §6.13 */

    .omi-note .omi-face svg { width: 22px; height: 22px; color: var(--ink); }
    .omi-note .note-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .omi-note .note-actions button {
      border: 1px solid var(--border);
      background: var(--surface);

      font-size: 13px;

      padding: 8px 12px;

      background: var(--ink);
      border-color: var(--ink);
      color: var(--on-primary);

    .help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .help-col { background: var(--soft); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .help-col .caption { display: block; margin-bottom: 6px; font-weight: 600; }
    .help-col p { font-size: 13px; line-height: 1.4; margin: 4px 0; }
    .quote { font-size: 14px; line-height: 1.45; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .quote:last-child { border-bottom: 0; }
    .quote .meta { margin-top: 2px; }

    .empty-goals { text-align: left; }
    .empty-goals .illus-wrap { margin: 8px 0 12px; }

    .goal-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      padding: 0;
      min-height: 32px;
      margin: -2px 0 4px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .ou-toast {
      position: absolute;
      left: 50%;
      bottom: calc(108px + var(--safe-b));
      transform: translateX(-50%) translateY(8px);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(340px, calc(100% - 32px));
      background: var(--ink);
      color: var(--on-primary);
      border-radius: 14px;
      padding: 10px 10px 10px 16px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(17, 17, 17, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
    }
    .ou-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .ou-toast span { flex: 1; }
    .ou-toast button {
      border: 0;
      background: transparent;
      color: var(--on-primary);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      min-height: 36px;
      padding: 0 10px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .screen.no-tab ~ .ou-toast { bottom: calc(24px + var(--safe-b)); }

    /* ── +1 engagement atoms (Today · Focus · Complete · Progress · Omi) ── */
    .plus-week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin: 10px 0 6px;
    }
    .pw-cell { display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--muted); font-weight: 600; }
    .pw-dot {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1.5px dashed var(--border);
      display: grid; place-items: center;
      font-size: 10px; font-weight: 700; letter-spacing: -0.04em;
      color: var(--muted);
      background: transparent;
    }
    .pw-cell.done .pw-dot { border: 0; background: var(--ink); color: var(--on-primary); }
    .pw-cell.part .pw-dot { border: 1.5px solid var(--ink); color: var(--ink); background: var(--soft); }
    .pw-cell.today .pw-dot { border-style: solid; border-color: var(--ink); color: var(--ink); }
    .pw-cell.today.done .pw-dot { color: var(--on-primary); box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px var(--ink); }
    .pw-cell.today.part .pw-dot { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px var(--ink); }
    .pw-cell.today { color: var(--ink); }
    .pw-cell.pop .pw-dot { animation: pwPop 520ms cubic-bezier(.2, 1.4, .4, 1) 200ms both; }
    @keyframes pwPop { from { transform: scale(0.4); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }
    .plus-card {
      width: 100%;
      text-align: left;
      font: inherit;
      color: var(--ink);
      cursor: pointer;
    }
    .plus-card .so-what { margin-top: 6px; }

    .evening-nudge {
      background: var(--coach);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin: 12px 0 4px;

      gap: 12px;
      align-items: center;

    .evening-nudge .btn { width: auto; min-height: 40px; padding: 0 14px; margin: 0; font-size: 14px; }
    .tiny-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }

    .tiny-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;

    }

    .focus-ring {
      --p: 0;
      width: 188px; height: 188px; border-radius: 50%;
      margin: 18px auto 10px;

      display: grid; place-items: center;
      transition: background 400ms linear;

    .focus-ring span { font-size: 12px; color: var(--muted); font-weight: 600; }

    .step-list { margin: 8px 0 4px; }

    .step-check.on .box { background: var(--ink); border-color: var(--ink); }
    .step-check.on .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); }

    .goal-bump { margin-top: 4px; }

    .goal-bump .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 999px; transition: width 900ms cubic-bezier(.2, .8, .2, 1); }
    .goal-bump .track i.gain { background: var(--success); }
    .goal-bump .delta { font-size: 13px; font-weight: 700; color: var(--success); }
    .ms-reps { display: flex; gap: 6px; margin-top: 8px; }
    .ms-reps i { flex: 1; height: 6px; border-radius: 999px; background: var(--soft); }
    .ms-reps i.on { background: var(--ink); }
    .ms-reps i.new { background: var(--success); animation: pwPop 520ms ease-out 300ms both; }

    .plus-jar {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 5px;
      margin: 12px 0 4px;
    }

    .jar-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }

    .story-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

    .story-card .seg { margin: 10px 0 6px; }
    .jar-months { display: grid; gap: 2px; margin-top: 6px; }

    .jar-month .jm-count { font-size: 13px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

    .jar-detail { margin: 2px 0 8px 54px; border-left: 1.5px solid var(--border); padding-left: 12px; }

    .jd-more { font-size: 12px; color: var(--muted); padding: 4px 0 2px; }
    .moments { list-style: none; margin: 8px 0 0; padding: 0; position: relative; }

    .bg-row .bg-top b { font-weight: 600; }
    .bg-row .bg-top span { font-variant-numeric: tabular-nums; font-weight: 600; }
    .bg-row .track { margin: 6px 0 4px; }
    .bg-row .bg-meta { font-size: 12px; color: var(--muted); }

    /* OneUp Plus — preview · paywall · lock rows (pages/plus.md) */
    .plus-cap { font-size: 12px; color: var(--muted); margin: 0 0 6px; }

      font-size: 13px; line-height: 1.4;

    .plus-head .illus-wrap { margin: 0 auto; }
    .plus-head .muted { margin: 6px auto 0; max-width: 32ch; }
    .plus-rows { list-style: none; padding: 0; margin: 14px 0 6px; display: grid; gap: 12px; }
    .plus-rows li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 15px; line-height: 1.35; font-weight: 600; }
    .plus-rows li::before {
      content: "✓"; width: 22px; height: 22px; border-radius: 50%;
      background: var(--ink); color: var(--on-primary);
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
    }
    .plus-rows li span { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 1px; }
    .plan-pills { display: grid; gap: 12px; margin: 18px 0 10px; }
    .plan-pill {
      position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px;
      width: 100%; min-height: 64px; padding: 12px 14px; border-radius: 16px;
      border: 1.5px solid var(--border); background: var(--surface); color: var(--ink);
      font: inherit; text-align: left; cursor: pointer;
    }
    .plan-pill[aria-checked="true"] { background: var(--ink); color: var(--on-primary); border-color: var(--ink); }
    .plan-pill .pp-name { font-size: 15px; font-weight: 700; }
    .plan-pill .pp-price { font-size: 17px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
    .plan-pill .pp-sub, .plan-pill .pp-week { font-size: 12px; opacity: 0.75; }
    .plan-pill .pp-week { text-align: right; font-variant-numeric: tabular-nums; }
    .plan-pill .pp-tag {
      position: absolute; top: -10px; left: 12px; font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--ink);
    }
    .plus-anchor { text-align: center; font-size: 14px; font-weight: 600; margin: 2px 0 10px; }
    .plus-anchor span { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
    .trial-line { list-style: none; margin: 4px 0 14px; padding: 0; position: relative; }
    .trial-line::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: 16px; width: 1.5px; background: var(--border); }
    .trial-line li { position: relative; padding: 4px 0 10px 26px; font-size: 13px; color: var(--muted); line-height: 1.35; }
    .trial-line li::before {
      content: ""; position: absolute; left: 0; top: 7px; width: 13px; height: 13px; border-radius: 50%;
      background: var(--surface); border: 1.5px solid var(--ink);
    }
    .trial-line li:first-child::before { background: var(--ink); }
    .trial-line li b { display: block; font-size: 14px; color: var(--ink); font-weight: 600; }
    .plus-foot { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 10px; }
    .plus-foot .linkish { font-size: 12px; min-height: 32px; padding: 0 6px; }
    .pv-track { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; margin: 10px 0 4px; }
    .pv-track span { display: block; height: 100%; background: var(--ink); border-radius: inherit; }
    .path-item.next .box { border-color: var(--ink); }
    .path-item.next .txt { font-weight: 600; }
    .path-item .txt .push { font-style: italic; }
    .free-list { margin: 8px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }

    /* Sign in (journey step `signin`). Provider buttons follow Apple + Google branding
       rules, not the ink CTA atom: Apple = black / white by appearance, Google = official G. */
    .auth { display: flex; flex-direction: column; min-height: calc(100% - 8px); padding-top: 28px; }
    .auth-top { display: flex; justify-content: flex-end; }
    .auth-lang { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
    .auth-lang button { font: inherit; font-size: 12px; font-weight: 600; min-height: 32px; min-width: 40px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
    .auth-lang button[aria-pressed="true"] { background: var(--ink); color: var(--on-primary); }
    .auth-hero { margin-top: 28px; }
    .auth-hero .brand { font-size: 40px; margin-top: 18px; }
    .auth-hero .auth-promise { font-size: 17px; color: var(--muted); margin: 6px 0 0; }
    .auth-hero .auth-tag { font-size: 15px; line-height: 1.45; color: var(--ink); margin: 18px 0 0; max-width: 30ch; }
    .auth-note { margin-top: 22px; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 14px; line-height: 1.4; color: var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .auth-note .linkish { font-size: 14px; white-space: nowrap; min-height: 36px; }
    .auth-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
    .sso {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 50px;
      border-radius: 12px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; border: 0;
      transition: opacity 150ms, transform 120ms ease;
    }
    .sso:active { transform: scale(0.985); }
    .sso:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sso:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .sso[aria-busy="true"] { opacity: 1; }
    .sso svg { flex: 0 0 auto; display: block; }
    .sso .ou-load-mark { color: currentColor; }
    .sso-apple { background: #000; color: #fff; }
    :root[data-theme="dark"] .sso-apple { background: #fff; color: #000; }
    .sso-google { background: #fff; color: #1F1F1F; border: 1px solid #747775; font-weight: 500; }
    :root[data-theme="dark"] .sso-google { background: #131314; color: #E3E3E3; border-color: #8E918F; }
    .auth-trust { font-size: 13px; line-height: 1.45; color: var(--muted); margin: 16px 2px 0; display: flex; gap: 8px; }
    .auth-trust svg { flex: 0 0 auto; margin-top: 2px; }
    .auth-legal { font-size: 12px; line-height: 1.5; color: var(--muted); text-align: center; margin: auto 0 0; padding: 28px 8px 6px; }
    .auth-legal button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; min-height: 28px; }
    .auth .demo-fold { margin-top: 8px; }
    /* System sheets (not OneUp UI) — mocked so the flow can be walked */
    .sys-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.42); z-index: 60; display: flex; align-items: flex-end; animation: sysIn .2s ease-out; }
    .sys-scrim.center { align-items: center; justify-content: center; }
    @keyframes sysIn { from { opacity: 0; } to { opacity: 1; } }
    .sys-sheet {
      width: 100%; background: #F2F2F7; color: #000; border-radius: 14px 14px 0 0; padding: 10px 16px 28px;
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; box-sizing: border-box;
    }
    :root[data-theme="dark"] .sys-sheet { background: #1C1C1E; color: #fff; }
    .sys-grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,.3); margin: 0 auto 12px; }
    .sys-head { display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 600; }
    .sys-head button { font: inherit; font-weight: 400; color: #007AFF; background: none; border: 0; cursor: pointer; min-height: 44px; }
    :root[data-theme="dark"] .sys-head button { color: #0A84FF; }
    .sys-group { background: #fff; border-radius: 12px; margin-top: 14px; overflow: hidden; }
    :root[data-theme="dark"] .sys-group { background: #2C2C2E; }
    .sys-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; font-size: 16px; width: 100%; background: none; border: 0; color: inherit; font-family: inherit; text-align: left; cursor: pointer; }
    .sys-row + .sys-row { border-top: .5px solid rgba(60,60,67,.29); }
    .sys-row small { display: block; font-size: 13px; opacity: .6; }
    .sys-row .chk { margin-left: auto; color: #007AFF; font-weight: 600; }
    .sys-note { font-size: 13px; line-height: 1.4; opacity: .6; margin: 10px 4px 0; }
    .sys-cta { width: 100%; margin-top: 18px; min-height: 50px; border-radius: 12px; border: 0; background: #007AFF; color: #fff; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
    :root[data-theme="dark"] .sys-cta { background: #0A84FF; }
    .sys-alert { width: 270px; background: rgba(242,242,247,.96); color: #000; border-radius: 14px; text-align: center; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
    :root[data-theme="dark"] .sys-alert { background: rgba(44,44,46,.96); color: #fff; }
    .sys-alert .a-body { padding: 18px 16px 16px; font-size: 13px; line-height: 1.35; }
    .sys-alert .a-body b { display: block; font-size: 17px; margin-bottom: 4px; }
    .sys-alert .a-btns { display: grid; grid-template-columns: 1fr 1fr; border-top: .5px solid rgba(60,60,67,.29); }
    .sys-alert .a-btns button { font: inherit; font-size: 17px; min-height: 44px; border: 0; background: none; color: #007AFF; cursor: pointer; }
    .sys-alert .a-btns button + button { border-left: .5px solid rgba(60,60,67,.29); font-weight: 600; }
    .g-sheet { width: 100%; background: #fff; color: #1F1F1F; border-radius: 14px 14px 0 0; padding: 0 0 22px; font-family: Roboto, Arial, system-ui, sans-serif; }
    :root[data-theme="dark"] .g-sheet { background: #131314; color: #E3E3E3; }
    .g-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-family: -apple-system, system-ui, sans-serif; font-size: 13px; border-bottom: .5px solid rgba(60,60,67,.2); }
    .g-bar button { font: inherit; font-size: 17px; color: #007AFF; background: none; border: 0; min-height: 40px; cursor: pointer; }
    .g-body { padding: 18px 22px 0; }
    .g-body h3 { font-size: 22px; font-weight: 400; margin: 14px 0 4px; }
    .g-body p { font-size: 14px; margin: 0; opacity: .75; }
    .g-acct { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 4px; border: 0; border-bottom: 1px solid rgba(116,119,117,.3); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .g-acct .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #0B57D0; color: #fff; font-weight: 500; font-size: 14px; }
    .g-acct .av.ghost { background: none; border: 1px solid rgba(116,119,117,.6); color: inherit; }
    .g-acct small { display: block; font-size: 12px; opacity: .7; }
    .acct-id { display: flex; gap: 12px; align-items: center; margin: 4px 0 8px; }
    .acct-chip { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: var(--on-primary); display: grid; place-items: center; font-weight: 600; }
    .acct-id small { display: block; color: var(--muted); font-size: 13px; }
    .manage-row.danger small { color: var(--muted); }

    /* Widgets gallery (journey step `widgets`). Each .wg scopes its own tokens so a
       light widget can sit on a dark app (and vice versa) like the real Home Screen. */
    .wg-ctl { display: flex; gap: 6px; overflow-x: auto; margin: 10px -2px 0; padding: 2px; scrollbar-width: none; }
    .wg-ctl::-webkit-scrollbar { display: none; }
    .wg-ctl .chip { flex: 0 0 auto; min-height: 36px; padding: 6px 12px; font-size: 13px; }
    .wg-ctl-label { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 12px 0 0; }
    .wg-wall {
      border-radius: 28px; padding: 14px; margin: 14px 0 8px; position: relative; overflow: hidden;
      background: linear-gradient(165deg, #E9E7E1 0%, #D9D6CE 100%);
    }
    .wg-wall[data-look="dark"] { background: linear-gradient(165deg, #1A1A18 0%, #050505 100%); }
    .wg-wall[data-look="clear"], .wg-wall[data-look="tinted"], .wg-wall.photo {
      background:
        radial-gradient(120% 80% at 10% 0%, #7C9CC0 0%, transparent 60%),
        radial-gradient(90% 70% at 100% 60%, #D39A76 0%, transparent 65%),
        linear-gradient(170deg, #3A4E66 0%, #1E2733 100%);
    }
    .wg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .wg-grid .span2 { grid-column: 1 / -1; }
    .wg {
      --w-bg: #FFFFFF; --ink: #111111; --muted: #6B6B6B; --soft: #F0F0EE; --border: #E8E8E6; --surface: #FFFFFF; --on-primary: #FFFFFF;
      background: var(--w-bg); color: var(--ink); border-radius: 22px; padding: 14px; position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 22px rgba(0,0,0,.08);
      display: flex; flex-direction: column; min-width: 0; text-align: left; font: inherit; border: 0;
    }
    button.wg { cursor: pointer; }
    .wg[data-look="dark"] { --w-bg: #1C1C1A; --ink: #F7F7F5; --muted: #A3A3A0; --soft: #2A2A28; --border: #2E2E2C; --surface: #1C1C1A; --on-primary: #111111; }
    .wg[data-look="clear"], .wg[data-look="tinted"] {
      --ink: #FFFFFF; --muted: rgba(255,255,255,.72); --soft: rgba(255,255,255,.18); --border: rgba(255,255,255,.3); --on-primary: #1E2733;
      --w-bg: rgba(255,255,255,.14);
      backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28), 0 8px 22px rgba(0,0,0,.18);
    }
    .wg[data-look="tinted"] { --w-bg: rgba(38,84,170,.62); --muted: rgba(214,228,255,.8); --soft: rgba(190,212,255,.22); }
    .wg-s { aspect-ratio: 1 / 1; }
    .wg-m { min-height: 158px; }
    .wg-l { min-height: 340px; }
    .wg-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .wg-area { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wg-mark { font-weight: 700; font-size: 13px; letter-spacing: -.02em; }
    .wg-title { font-size: 15px; font-weight: 600; line-height: 1.25; margin: 8px 0 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    .wg-s .wg-title { font-size: 14px; }
    .wg-l .wg-title { font-size: 19px; -webkit-line-clamp: 2; }
    .wg-title.muted-t { color: var(--muted); font-weight: 500; }
    .wg-meta { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .wg-why { font-size: 13px; color: var(--muted); line-height: 1.35; margin: 6px 0 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .wg-fill { flex: 1; }
    .wg-row { display: flex; align-items: center; gap: 10px; }
    .wg-row.between { justify-content: space-between; }
    .wg-btns { display: flex; gap: 8px; margin-top: 10px; }
    .wg-btn {
      font: inherit; font-size: 13px; font-weight: 600; min-height: 34px; padding: 0 14px; border-radius: 999px; cursor: pointer;
      background: var(--soft); color: var(--ink); border: 0; display: inline-flex; align-items: center; gap: 6px;
    }
    .wg-btn.ink { background: var(--ink); color: var(--on-primary); }
    .wg-dots { display: flex; gap: 5px; align-items: center; }
    .wg-dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box; }
    .wg-dot.done { background: var(--ink); border-color: var(--ink); }
    .wg-dot.part { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); border-color: var(--ink); }
    .wg-dot.today { outline: 1.5px solid var(--ink); outline-offset: 1.5px; }
    .wg-dot.later { opacity: .4; }
    .wg-steps { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.45; }
    .wg-steps li { display: flex; gap: 8px; color: var(--muted); }
    .wg-steps li::before { content: "·"; color: var(--ink); font-weight: 700; }
    .wg-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    .wg-omi svg { display: block; }
    .wg-cap { font-size: 11px; color: var(--muted); margin: 6px 2px 0; }
    .wg-wall .wg-cap { color: rgba(17,17,17,.62); }
    .wg-wall[data-look="dark"] .wg-cap, .wg-wall[data-look="clear"] .wg-cap, .wg-wall[data-look="tinted"] .wg-cap, .wg-wall.photo .wg-cap, .wg-wall.black .wg-cap { color: rgba(255,255,255,.7); }
    /* Lock Screen · vibrant rendering */
    .wg-lock { color: #fff; text-align: center; padding: 22px 14px 18px; }
    .wg-lock .lk-date { font-size: 15px; font-weight: 600; opacity: .9; }
    .wg-lock .lk-inline { font-size: 14px; font-weight: 600; opacity: .9; margin-top: 2px; display: inline-flex; gap: 6px; align-items: center; }
    .wg-lock .lk-time { font-size: 76px; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin: 2px 0 14px; }
    .wg-lock .lk-row { display: flex; gap: 10px; justify-content: center; align-items: stretch; }
    .lk-acc { background: rgba(255,255,255,.16); border-radius: 18px; color: #fff; font: inherit; border: 0; cursor: pointer; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .lk-circ { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .lk-circ svg { position: absolute; inset: 0; }
    .lk-circ b { font-size: 15px; }
    .lk-rect { flex: 0 1 190px; text-align: left; padding: 8px 12px; min-height: 68px; box-sizing: border-box; }
    .lk-rect .t { font-size: 14px; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .lk-rect .m { font-size: 12px; opacity: .75; }
    .lk-banner { background: rgba(28,28,26,.72); color: #fff; border-radius: 22px; padding: 14px; text-align: left; margin-top: 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .lk-banner .wg-btn { background: rgba(255,255,255,.18); color: #fff; }
    .lk-banner .wg-btn.ink { background: #fff; color: #111; }
    .lk-bar { height: 5px; border-radius: 999px; background: rgba(255,255,255,.2); overflow: hidden; margin: 10px 0 0; }
    .lk-bar span { display: block; height: 100%; background: #fff; border-radius: inherit; transition: width .9s linear; }
    .wg-t { font-variant-numeric: tabular-nums; }
    /* StandBy — no container background; night = red monochrome */
    .wg-wall.black { background: #000; }
    .sb { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; aspect-ratio: 2.05 / 1; color: #fff; }
    .sb .sb-clock { font-size: 64px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; text-align: center; }
    .sb .sb-w { text-align: left; }
    .sb .sb-w .wg-area, .sb .sb-w .wg-meta { color: rgba(255,255,255,.62); }
    .sb .sb-w .wg-title { font-size: 20px; -webkit-line-clamp: 3; }
    .sb.night { color: #E5484D; }
    .sb.night .sb-w .wg-area, .sb.night .sb-w .wg-meta { color: rgba(229,72,77,.62); }
    /* Dynamic Island */
    .di-stage { display: grid; gap: 14px; justify-items: center; }
    .di { background: #000; color: #fff; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 14px; }
    .di.compact { width: 250px; height: 37px; padding: 0 14px; }
    .di.compact .cam { width: 92px; }
    .di.minimal { width: 37px; height: 37px; justify-content: center; position: relative; }
    .di.minimal svg { position: absolute; inset: 0; }
    .di.expanded { width: 100%; max-width: 340px; border-radius: 42px; padding: 16px 20px 18px; flex-direction: column; align-items: stretch; gap: 8px; font-weight: 500; }
    .di.expanded .top { display: flex; justify-content: space-between; align-items: center; }
    .di.expanded .big { font-size: 30px; font-weight: 700; }
    .di.expanded .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .di.expanded .wg-btn { background: rgba(255,255,255,.16); color: #fff; align-self: flex-start; }
    .di-lab { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0; }
    /* Control Center */
    .cc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 6px; }
    .cc-tile {
      aspect-ratio: 1 / 1; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; border: 0; cursor: pointer;
      display: grid; place-items: center; font: inherit; font-size: 20px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .cc-tile.wide { grid-column: span 2; aspect-ratio: auto; border-radius: 999px; display: flex; gap: 10px; justify-content: flex-start; padding: 0 14px; text-align: left; font-size: 13px; }
    .cc-tile.wide .ic { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-size: 15px; flex: 0 0 auto; }
    .cc-tile.wide small { display: block; opacity: .7; font-size: 11px; }
    .cc-tile.on .ic, .cc-tile.on:not(.wide) { background: #fff; color: #111; }
    .cc-tile.ghost-t { opacity: .35; cursor: default; }
    .cc-lab { grid-column: 1 / -1; font-size: 11px; color: rgba(255,255,255,.7); margin: 2px 4px 0; }
    .ab-hint { background: rgba(28,28,26,.82); color: #fff; border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; }
    /* Watch */
    .watch { width: 190px; height: 228px; border-radius: 48px; background: #000; margin: 0 auto; padding: 18px 14px; box-sizing: border-box; color: #fff; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 0 0 6px #2A2A28; position: relative; }
    .watch .w-time { text-align: right; font-size: 15px; font-weight: 600; }

        id: 1, key: "seed", en: "Seed", vi: "Mầm",
        needBond: 0, needGoals: 0,
        blurb: "Perfect circle — cute, clear, just arriving.",
        unlock: "Start"
      },
      {
        id: 2, key: "companion", en: "Companion", vi: "Bạn đồng hành",
        needBond: 40, needGoals: 1,
        blurb: "Same cute face + soft orbit sparks beside you.",
        unlock: "Bond 40 + 1 goal"
      },
      {
        id: 3, key: "guide", en: "Guide", vi: "Người dẫn",
        needBond: 120, needGoals: 2,
        blurb: "Double ring + halo marks — sharper, still adorable.",
        unlock: "Bond 120 + 2 goals"
      },
      {
        id: 4, key: "anchor", en: "Anchor", vi: "Neo",
        needBond: 320, needGoals: 3,
        blurb: "Power aura + star crown — iconic, never warped.",
        unlock: "Bond 320 + 3 goals"
      }
    ];

    function activeGoalCount() {
      // Bond forms: goals you've set and kept (paused / removed don't count; completed chapters do).
      return state.goals.filter(g => ["focus", "active", "completed"].includes(g.status)).length;
    }

    function liveGoals() {
      return state.goals.filter(g => g.status === "focus" || g.status === "active");
    }

    function goalById(id = state.goalId) {
      return state.goals.find(g => g.id === id) || state.goals[0];
    }

    function resolveOmiForm(bond = state.bondPoints, goals = activeGoalCount()) {
      if (state.omiFormOverride) {
        return OMI_FORMS.find(f => f.id === state.omiFormOverride) || OMI_FORMS[0];
      }
      return liveOmiForm(bond, goals);
    }

    function liveOmiForm(bond = state.bondPoints, goals = activeGoalCount()) {
      let form = OMI_FORMS[0];
      for (const f of OMI_FORMS) {
        if (bond >= f.needBond && goals >= f.needGoals) form = f;
      }
      return form;
    }

    function nextOmiForm(current = resolveOmiForm()) {
      return OMI_FORMS.find(f => f.id === current.id + 1) || null;
    }

    function moodUnlocked(moodKey, form = resolveOmiForm()) {
      const m = OMI_MOODS[moodKey];
      return m && form.id >= m.minForm;
    }

    function safeMood(preferred, form = resolveOmiForm()) {
      if (moodUnlocked(preferred, form)) return preferred;
      const fallback = ["idle", "wave", "quiet", "think"].find(k => moodUnlocked(k, form));
      return fallback || "idle";
    }

    function bondProgressHtml(form = resolveOmiForm()) {
      const next = nextOmiForm(form);
      if (!next) {
        return `<div class="bond-bar" aria-hidden="true"><i style="width:100%"></i></div>
          <p class="muted" style="font-size:12px">Anchor form — Bond keeps deepening quietly.</p>`;
      }
      const span = next.needBond - form.needBond || 1;
      const gained = Math.max(0, state.bondPoints - form.needBond);
      const pct = Math.min(100, Math.round((gained / span) * 100));
      const goalsOk = activeGoalCount() >= next.needGoals;
      return `<div class="bond-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
        <p class="muted" style="font-size:12px">${state.bondPoints} Bond · next <strong>${next.en}</strong> at ${next.needBond}
        ${goalsOk ? "" : ` · need ${next.needGoals} goals (${activeGoalCount()} now)`}</p>`;
    }

    function bondPillHtml() {
      const form = resolveOmiForm();
      return `<div class="bond-pill">${form.en} · ${form.vi}
        <span style="color:var(--muted);font-weight:500">${state.bondPoints} Bond</span>
        <button type="button" data-go="omi-bond">Grow</button></div>`;
    }

    function showBondEarn(amount, note) {
      let el = document.getElementById("bondEarn");
      if (!el) {
        el = document.createElement("div");
        el.id = "bondEarn";
        el.className = "bond-earn";
        document.body.appendChild(el);
      }
      el.textContent = `+${amount} Bond${note ? " · " + note : ""}`;
      el.classList.toggle("lift", !!$("ouToast")?.classList.contains("show"));
      el.classList.add("show");
      clearTimeout(showBondEarn._t);
      showBondEarn._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function addBond(amount, note) {
      const before = liveOmiForm().id;
      state.bondPoints += amount;
      state.bondLog.unshift({ amt: amount, note: note || "Bond", when: "Today" });
      state.bondLog = state.bondLog.slice(0, 8);
      showBondEarn(amount, note);
      updateTabOmi();
      const leveled = liveOmiForm().id > before;
      if (leveled) state.evolveFrom = before;
      return leveled;
    }

    function omiBody(formKey) {
      // Always a perfect circle face — forms add ornaments, never warp the icon.
      const face = `<circle cx="24" cy="24" r="15.5" fill="none" stroke="currentColor" stroke-width="1.85"/>`;
      if (formKey === "seed") {
        return face;
      }
      if (formKey === "companion") {
        return `
          ${face}
          <path d="M5.5 18.5c1.2-2.8 3.4-3.6 4.6-2.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
          <path d="M42.5 18.5c-1.2-2.8-3.4-3.6-4.6-2.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
          <circle cx="7.2" cy="22.5" r="1.2" fill="currentColor" opacity=".45"/>
          <circle cx="40.8" cy="22.5" r="1.2" fill="currentColor" opacity=".45"/>`;
      }
      if (formKey === "guide") {
        return `
          <circle cx="24" cy="24" r="18.2" fill="none" stroke="currentColor" stroke-width="1.15" opacity=".28"/>
          ${face}
          <path d="M16 6.5c2.4-1.6 5.4-2.4 8-2.4s5.6.8 8 2.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="24" cy="4.2" r="1.7" fill="currentColor"/>
          <circle cx="18.2" cy="6.2" r="1.1" fill="currentColor" opacity=".55"/>
          <circle cx="29.8" cy="6.2" r="1.1" fill="currentColor" opacity=".55"/>`;
      }
      // anchor — powerful aura, still round & cute
      return `
        <circle class="aura" cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1" opacity=".22"/>
        <circle cx="24" cy="24" r="18.4" fill="none" stroke="currentColor" stroke-width="1.25" opacity=".4"/>
        ${face}
        <path d="M24 2.2l1.1 2.2 2.4.4-1.7 1.7.4 2.4L24 7.6l-2.2 1.3.4-2.4-1.7-1.7 2.4-.4Z" fill="currentColor"/>
        <path d="M8.5 10.5l.7 1.4 1.5.3-1.1 1.1.3 1.5-1.4-.7-1.4.7.3-1.5-1.1-1.1 1.5-.3Z" fill="currentColor" opacity=".7"/>
        <path d="M39.5 10.5l.7 1.4 1.5.3-1.1 1.1.3 1.5-1.4-.7-1.4.7.3-1.5-1.1-1.1 1.5-.3Z" fill="currentColor" opacity=".7"/>
        <circle cx="24" cy="43.2" r="1.35" fill="currentColor" opacity=".5"/>
        <circle cx="5.8" cy="24" r="1.1" fill="currentColor" opacity=".35"/>
        <circle cx="42.2" cy="24" r="1.1" fill="currentColor" opacity=".35"/>`;
    }

    function omiFaceSvg(pose = "idle", size = 48, formOverride = null, className = "illus") {
      const form = formOverride || resolveOmiForm();
      const p = safeMood(OMI_MOODS[pose] ? pose : "idle", form);
      const eyesDot = `<circle class="eye" cx="17" cy="22" r="1.85" fill="currentColor"/><circle class="eye" cx="31" cy="22" r="1.85" fill="currentColor"/>`;
      const eyesClosed = `<path class="eye" d="M14.5 22c1.2-1.4 3.2-1.4 4.4 0M29 22c1.2-1.4 3.2-1.4 4.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;
      const eyesSleep = `<path class="eye" d="M14.5 22.5h5M28.5 22.5h5" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"/>`;
      const eyesWorry = `<path class="eye" d="M14 20.2c1.3-1.3 3.4-1.3 4.5 0M29.5 20.2c1.3-1.3 3.4-1.3 4.5 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="17" cy="23" r="1.55" fill="currentColor"/><circle cx="31" cy="23" r="1.55" fill="currentColor"/>`;
      const eyesListen = `<circle class="eye" cx="17" cy="22" r="2.05" fill="currentColor"/><circle class="eye" cx="31" cy="22" r="2.05" fill="currentColor"/>
        <circle cx="17.55" cy="21.4" r="0.55" fill="#fff"/><circle cx="31.55" cy="21.4" r="0.55" fill="#fff"/>`;

      let eyes = eyesDot;
      if (p === "celebrate" || p === "cheer" || p === "proud") eyes = eyesClosed;
      else if (p === "sleep") eyes = eyesSleep;
      else if (p === "worry") eyes = eyesWorry;
      else if (p === "listen" || p === "spark") eyes = eyesListen;

      let mouth = "M17.5 29.5c2.2 2.4 6.8 2.4 9 0";
      if (p === "celebrate" || p === "cheer") mouth = "M15.5 29c3.2 4.4 9.8 4.4 13 0";
      else if (p === "proud" || p === "blush") mouth = "M16.5 29.8c2.6 2.9 8 2.9 10.6 0";
      else if (p === "quiet" || p === "sleep") mouth = "M19 31h10";
      else if (p === "worry") mouth = "M18.5 31.2c1.6-1.1 5-1.1 6.6 0";
      else if (p === "wave") mouth = "M16.5 29.2c2.6 2.6 8 2.6 10.6 0";
      else if (p === "listen") mouth = "M18.5 30.5h11";
      else if (p === "spark") mouth = "M17.2 29.5c2.4 2.8 7.2 2.8 9.6 0";

      // Cheeks always slightly present on Companion+; celebrate moods amplify via CSS
      const cheekOpacity = form.id >= 2 ? (p === "blush" || p === "celebrate" || p === "cheer" ? "0.55" : "0.22") : "0";
      const cheeks = `<ellipse class="cheek" cx="11.5" cy="27.5" rx="3.2" ry="2" fill="currentColor" opacity="${cheekOpacity}"/><ellipse class="cheek" cx="36.5" cy="27.5" rx="3.2" ry="2" fill="currentColor" opacity="${cheekOpacity}"/>`;
      const sparkles = `<g class="sparkle" opacity="0">
        <path d="M7 9l1.15 2.3 2.35.4-1.7 1.65.4 2.35L7 14.5l-2.2 1.2.4-2.35-1.7-1.65 2.35-.4Z" fill="currentColor"/>
        <path d="M40 7.5l.95 1.9 1.95.35-1.4 1.35.35 1.95L40 12l-1.85 1.05.35-1.95-1.4-1.35 1.95-.35Z" fill="currentColor"/>
        <path d="M41 29.5l.7 1.4 1.45.25-1.05 1 .25 1.45L41 32.5l-1.35.8.25-1.45-1.05-1 1.45-.25Z" fill="currentColor"/>
      </g>`;
      const thinkDots = `<g>
        <circle class="dot d1" cx="37.5" cy="10.5" r="2.1" fill="currentColor"/>
        <circle class="dot d2" cx="41.2" cy="6.8" r="1.5" fill="currentColor"/>
        <circle class="dot d3" cx="43.5" cy="3.6" r="1" fill="currentColor"/>
      </g>`;
      const hand = p === "wave"
        ? `<path class="hand" d="M38.5 15.5c2.2-3.2 5.2-2.4 4.8 1.3-.25 2-1.85 2.8-3.3 2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>`
        : "";
      const zzz = p === "sleep"
        ? `<text class="zzz" x="35" y="11" font-size="8" font-weight="700" fill="currentColor" opacity=".5">z</text>
           <text class="zzz" x="39.5" y="6.5" font-size="6" font-weight="700" fill="currentColor" opacity=".35">z</text>`
        : "";
      const brow = p === "think"
        ? `<path d="M13.5 17.2c1.5-1 4-1 5.4 0M29 17.2c1.5-1 4-1 5.4 0" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" opacity=".55"/>`
        : "";

      return `<svg class="${className} mood-${p} form-${form.key}" viewBox="0 0 48 48" width="${size}" height="${size}" aria-hidden="true">
        <g class="face">
          ${omiBody(form.key)}
          ${brow}
          ${eyes}
          ${cheeks}
          <path d="${mouth}" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"/>
        </g>
        ${p === "think" ? thinkDots : ""}
        ${p === "celebrate" || p === "cheer" || p === "spark" ? sparkles : ""}
        ${hand}
        ${zzz}
      </svg>`;
    }

    function updateOmiFloat() {
      const btn = $("omiFloat");
      const slot = $("omiFloatIcon");
      const hintEl = $("omiFloatHint");
      if (!btn || !slot) return;

      const step = state.step;
      const hideSteps = new Set([
        "signin", "welcome", "omi-hello", "priority", "why", "blocker", "time", "summary",
        "goal-start", "clarify", "approve", "countdown", "execute", "plus", "widgets",
        ...GOAL_COVER_STEPS
      ]);
      const boot = $("boot");
      const bootUp = boot && !boot.hidden && !boot.classList.contains("exit");
      const show = !hideSteps.has(step) && !state.daySheetOpen && !bootUp;
      btn.classList.toggle("hidden", !show);
      if (!show) return;

      const ctx = omiFloatContext(step);
      const form = resolveOmiForm();
      const mood = safeMood(ctx.mood, form);
      slot.innerHTML = omiFaceSvg(mood, 40, form, "omi-float-face");
      if (hintEl) hintEl.textContent = ctx.hint;
      btn.classList.toggle("hint-off", !state.omiFloat.hintOn);
      btn.dataset.corner = state.omiFloat.corner || "br";
      btn.setAttribute(
        "aria-label",
        `Open Omi · ${form.en} · ${ctx.hint}. Drag to move. Double-tap to reset position.`
      );
      applyOmiFloatPosition();
    }

    function omiFloatContext(step) {
      // Adaptive companion presence by surface (not a second Today CTA).
      if (["recovery", "lost-progress"].includes(step)) return { mood: "worry", hint: "Come back" };
      if (step === "share") return { mood: "blush", hint: "Share soft" };
      if (step === "complete" || step === "goal-complete") return { mood: "celebrate", hint: "Nice work" };
      if (step === "streak-good") return { mood: "proud", hint: "Proud" };
      if (["reflect", "deepen", "ask", "memory"].includes(step)) return { mood: "listen", hint: "Listening" };
      if (["progress", "weekly", "journey", "learned"].includes(step)) return { mood: "spark", hint: "Insight" };
      if (step === "goal-insight") return { mood: "spark", hint: "Insight" };
      if (step === "goal-chapter") return { mood: "proud", hint: "Chapter" };
      if (["goals", "goal-detail", "adapt", "next-oneup"].includes(step)) return { mood: "listen", hint: "Goals" };
      if (["omi", "omi-feelings", "omi-bond", "omi-evolve"].includes(step)) return { mood: "wave", hint: "I'm here" };
      if (step === "skip") return { mood: "quiet", hint: "Soft" };
      if (state.completedToday && step === "today") return { mood: "celebrate", hint: "Done" };
      if (step === "change" || step === "checkin") return { mood: "think", hint: "Think" };
      return { mood: "think", hint: "Think" };
    }

    function applyOmiFloatPosition() {
      const btn = $("omiFloat");
      const phone = document.querySelector(".phone");
      if (!btn || !phone || btn.classList.contains("hidden")) return;
      const pad = 12;
      const tabH = tabbar.classList.contains("hidden") ? 16 : 96;
      const size = 56;
      const w = phone.clientWidth;
      const h = phone.clientHeight;
      const corner = state.omiFloat.corner || "br";

      let left;
      let top;
      if (state.omiFloat.x != null && state.omiFloat.y != null) {
        left = Math.min(Math.max(pad, state.omiFloat.x), w - size - pad);
        top = Math.min(Math.max(pad + 40, state.omiFloat.y), h - size - tabH - pad);
      } else {
        const right = pad;
        const bottom = tabH + pad;
        left = corner === "bl" || corner === "tl" ? pad : w - size - right;
        top = corner === "tl" || corner === "tr" ? pad + 44 : h - size - bottom;
      }
      btn.style.left = `${left}px`;
      btn.style.top = `${top}px`;
      btn.style.right = "auto";
      btn.style.bottom = "auto";
    }

    function snapOmiFloat(left, top) {
      const phone = document.querySelector(".phone");
      if (!phone) return;
      const w = phone.clientWidth;
      const h = phone.clientHeight;
      const cx = left + 28;
      const cy = top + 28;
      const corner =
        (cy < h / 2 ? "t" : "b") + (cx < w / 2 ? "l" : "r");
      state.omiFloat.corner = corner;
      state.omiFloat.x = null;
      state.omiFloat.y = null;
      applyOmiFloatPosition();
    }

    function resetOmiFloat() {
      state.omiFloat.corner = "br";
      state.omiFloat.x = null;
      state.omiFloat.y = null;
      applyOmiFloatPosition();
    }

    // Keep legacy name used by addBond
    function updateTabOmi() {
      updateOmiFloat();
    }

    function omiIllus(pose = "think", opts = {}) {
      const form = opts.form || resolveOmiForm();
      const p = safeMood(OMI_MOODS[pose] ? pose : "idle", form);
      const showLabel = opts.label === true;
      const meta = OMI_MOODS[p];
      return `<div class="illus-wrap" data-omi-mood="${p}" data-omi-form="${form.key}">
        ${omiFaceSvg(p, opts.size || 88, form)}
        ${showLabel ? `<p class="feel-label">${meta.label} · ${meta.vi}</p>` : ""}
      </div>`;
    }

    function omi(text, mood = "idle") {
      const form = resolveOmiForm();
      const p = safeMood(mood, form);
      return `<div class="omi-row enter"><div class="avatar omi-face" aria-hidden="true">${omiFaceSvg(p, 36, form)}</div><div class="bubble">${text}</div></div>`;
    }
    function sparkline(values, opts = {}) {
      const w = 280, h = 72, pad = 6;
      const max = Math.max(...values, 1);
      const step = (w - pad * 2) / (values.length - 1);
      const ptsArr = values.map((v, i) => {
        const x = pad + i * step;
        const y = h - pad - (v / max) * (h - pad * 2);
        return { x, y, v };
      });
      const pts = ptsArr.map(p => `${p.x},${p.y}`).join(" ");
      const area = `${pad},${h - pad} ${pts} ${w - pad},${h - pad}`;
      const label = opts.label || `Consistency over ${values.length} weeks`;
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">
        <polygon points="${area}" fill="currentColor" opacity="0.07"/>
        <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
        ${ptsArr.map((p, i) => {
          const last = i === ptsArr.length - 1;
          return `<circle cx="${p.x}" cy="${p.y}" r="${last ? 3.5 : 2.25}" fill="currentColor"${last ? "" : ' opacity="0.85"'}/>`;
        }).join("")}
      </svg>`;
    }

    function donut(pct, opts = {}) {
      const size = opts.size || 112;
      const stroke = opts.stroke || 10;
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const p = Math.max(0, Math.min(100, pct));
      const dash = (p / 100) * c;
      const color = opts.color || "currentColor";
      const track = opts.track || "var(--soft)";
      return `<div class="donut-wrap" style="width:${size}px;height:${size}px">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
          <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
          <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
            stroke-linecap="round" stroke-dasharray="${dash} ${c - dash}"/>
        </svg>
        <div class="center"><strong>${opts.value != null ? opts.value : Math.round(p) + "%"}</strong><span>${opts.caption || ""}</span></div>
      </div>`;
    }

    function donutMini(pct, warn) {
      const size = 44, stroke = 5, r = (size - stroke) / 2, c = 2 * Math.PI * r;
      const p = Math.max(0, Math.min(100, pct));
      const dash = (p / 100) * c;
      const color = warn ? "var(--momentum)" : (p >= 60 ? "var(--success)" : "currentColor");
      return `<div class="donut-sm" aria-hidden="true">
        <svg viewBox="0 0 ${size} ${size}">
          <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="${stroke}"/>
          <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
            stroke-linecap="round" stroke-dasharray="${dash} ${c - dash}"/>
        </svg>
      </div>`;
    }
    function userBubble(text) {
      return `<div class="bubble user enter" style="margin:8px 0 8px auto;max-width:86%">${text}</div>`;
    }
    function chips(options, key, selected) {
      return `<div class="chip-row" role="group" aria-label="${key}">${
        options.map(o => `<button type="button" class="chip${selected === o ? " selected" : ""}" data-key="${key}" data-val="${o}">${o}</button>`).join("")
      }</div>`;
    }

    // Full-screen covers (journey = fullScreenCover): no dock, no Omi float.
    const NEW_GOAL_RAIL = ["goal-new", "goal-new-shape", "goal-new-draft", "goal-new-place"];
    const GOAL_COVER_STEPS = [...NEW_GOAL_RAIL, "goal-new-manual", "goal-new-done", "goal-edit", "goal-complete-check"];

    const ONBOARD_FULL = ["omi-hello", "priority", "why", "blocker", "time", "summary", "clarify", "approve"];
    const ONBOARD_QUICK = ["omi-hello", "priority", "time", "approve"];

    function onboardSteps() {
      return state.quickOnboard ? ONBOARD_QUICK : ONBOARD_FULL;
    }

    function onboardChrome(step) {
      const steps = onboardSteps();
      const i = steps.indexOf(step);
      if (i < 0) return "";
      const pct = Math.round(((i + 1) / steps.length) * 100);
      const back = i > 0 ? steps[i - 1] : "welcome";
      return `
        <div class="onboard-chrome enter">
          <div class="onboard-top">
            <button type="button" class="linkish" data-go="${back}">Back</button>
            <span class="onboard-count" aria-live="polite">${i + 1} / ${steps.length}</span>
            <button type="button" class="linkish" data-action="skip-onboard">Skip to Today</button>
          </div>
          <div class="onboard-track" role="progressbar" aria-valuemin="1" aria-valuemax="${steps.length}" aria-valuenow="${i + 1}" aria-label="Onboarding progress">
            <span style="width:${pct}%"></span>
          </div>
        </div>`;
    }

    /* ── Goals helpers ─────────────────────────────────────── */
    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }
    function capitalize(s) {
      const t = String(s || "").trim();
      return t ? t[0].toUpperCase() + t.slice(1) : "";
    }
    function shortTitle(s, n = 28) {
      return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
    }
    function statusLabel(s) {
      return { focus: "Focus", active: "Active", paused: "Paused", completed: "Chapter", removed: "Removed" }[s] || s;
    }
    function healthMeta(g) {
      const map = {
        "needs care": ["warn", "Needs care"],
        tracking: ["ok", "Tracking well"],
        steady: ["", "Steady"],
        quiet: ["warn", `Quiet · last +1 ${g.lastDone}`],
        paused: ["", "Paused"],
        chapter: ["ok", "Chapter closed"],
        new: ["", "New · first +1 soon"]
      };
      const [cls, label] = map[g.health] || ["", g.health];
      return { cls, label };
    }
    function ringHtml(g, size = "") {
      const { cls } = healthMeta(g);
      const tone = g.status === "paused" || g.status === "removed" ? "quiet" : cls;
      return `<span class="ring ${size} ${tone}" style="--p:${g.progress}" data-label="${g.progress}%" role="img" aria-label="${g.progress} percent toward goal"></span>`;
    }
    function nextAction(g) {
      return g.actions.find(a => a.today === "must")
        || g.actions.find(a => a.today)
        || g.actions.find(a => !a.paused && a.kind === "candidate")
        || g.actions[0];
    }
    function currentMilestone(g) {
      return g.milestones.find(m => !m.done);
    }
    function msCount(g) {
      return `${g.milestones.filter(m => m.done).length}/${g.milestones.length}`;
    }
    function refreshCurrent(g) {
      let set = false;
      g.milestones.forEach(m => {
        m.current = !m.done && !set;
        if (m.current) set = true;
      });
    }
    function omiNote(text, mood = "listen", actions = "", cls = "") {
      const form = resolveOmiForm();
      return `<div class="omi-note ${cls}">
        <span class="omi-face" aria-hidden="true">${omiFaceSvg(safeMood(mood, form), 22, form, "note-face")}</span>
        <div><div>${text}</div>${actions ? `<div class="note-actions">${actions}</div>` : ""}</div>
      </div>`;
    }
    function backHead(label, go, trailing = "") {
      return `<div class="page-head"><button type="button" class="linkish" data-go="${go}">‹ ${label}</button>${trailing}</div>`;
    }

    function goalRow(g) {
      const { label } = healthMeta(g);
      const na = nextAction(g);
      const sub = g.status === "paused" ? (g.pausedNote || "Paused")
        : g.status === "completed" ? (g.completedNote || "Completed")
        : g.status === "removed" ? (g.removedNote || "Removed")
        : `${label}${na ? ` · next: ${shortTitle(na.title, 26)}` : ""}`;
      return `<button type="button" class="goal-row" data-action="open-goal" data-goal="${g.id}" aria-label="${esc(g.title)}, ${statusLabel(g.status)}. ${esc(sub)}">
        ${ringHtml(g, "sm")}
        <span>
          <span class="caption">${g.area}</span>
          <span class="gr-title">${esc(g.title)}</span>
          <span class="gr-meta">${esc(sub)}</span>
        </span>
        <span class="gr-side"><span class="status-badge ${g.status}">${statusLabel(g.status)}</span><span class="chev" aria-hidden="true">›</span></span>
      </button>`;
    }

    function buildDraft(ng = state.ng) {
      const bank = DRAFT_BANK[ng.area] || DRAFT_BANK.Other;
      const v = ng.variant;
      const scale = v === "smaller" ? 0.5 : v === "bigger" ? 1.5 : 1;
      const size = m => Math.max(5, Math.round((m * scale) / 5) * 5);
      let ms = bank.ms.slice();
      if (v === "smaller") ms = ms.slice(0, 2);
      if (v === "bigger") ms.push(bank.stretch);
      const src = v === "angle" ? bank.alt : bank.acts;
      const lead = v === "smaller" ? `Smaller on purpose — first asks sit well under ${ng.time}.`
        : v === "bigger" ? "Stretch version — one extra milestone, longer sessions."
        : v === "angle" ? "Different angle — same outcome, a different kind of practice."
        : `Sized to ${ng.time} — your typical day.`;
      return {
        title: ng.titleOverride || capitalize(ng.text) || bank.title,
        outcome: bank.outcome,
        habit: bank.habit,
        milestones: ms.map(t => ({ t, on: true })),
        actions: src.map(([t, m]) => ({ title: t, minutes: size(m), on: true })),
        reasons: [
          lead,
          `“${ng.whyNow}” shaped the first habit.`,
          ng.horizon === "No deadline" ? "No deadline — milestones follow your rhythm, not a date." : `Milestones spaced across ${ng.horizon}.`
        ]
      };
    }

    function buildManualDraft(ng = state.ng) {
      const mins = parseInt(ng.time, 10) || 15;
      return {
        title: capitalize(ng.text),
        outcome: "",
        habit: "",
        milestones: [],
        actions: ng.nmAction ? [{ title: capitalize(ng.nmAction), minutes: mins, on: true }] : [],
        reasons: []
      };
    }

    function generateDraft() {
      runAskThinking(2400, "ngDraftHost").then(() => {
        if (state.step !== "goal-new-draft") return;
        state.ng.draft = buildDraft();
        render("goal-new-draft");
      });
    }

      if (f("geTitle") != null) ge.title = f("geTitle");
      if (f("geOutcome") != null) ge.outcome = f("geOutcome");
      if (f("geWhy") != null) ge.why = f("geWhy");
      ge.milestones.forEach((m, i) => {
        const v = f(`geMs${i}`);
        if (v != null) m.t = v;
      });

    function editDirty() {
      const g = goalById();
      const ge = state.ge;
      if (!ge) return false;
      const fields = ["title", "area", "outcome", "why", "cadence", "size", "horizon"];
      if (fields.some(k => String(ge[k]).trim() !== String(g[k]).trim())) return true;
      if (ge.milestones.length !== g.milestones.length) return true;
      return ge.milestones.some((m, i) => m.t.trim() !== g.milestones[i].t.trim());
    }
