name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  video-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video-engine/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s pipeline/tests -v
      - run: python3 pipeline/scripts/check-assets.py
