<!doctype html>
<html lang="vi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>ov-d01 — overlay diagram (compact)</title>
<link rel="stylesheet" href="tokens.css" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-SemiBold.ttf);font-weight:600}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Regular.ttf);font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#main{background:transparent}
#main{position:relative;width:100%;height:100%;overflow:hidden;font-family:"BVP",sans-serif;color:var(--vht-ink)}
#wrap{position:absolute;left:48px;right:48px;bottom:420px;display:flex;flex-direction:column;gap:18px}
.kicker{font-size:24px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--vht-accent);text-align:center}
.row{display:flex;gap:20px;align-items:stretch}
.card{flex:1;border:4px solid var(--vht-border);border-radius:28px;background:var(--vht-surface);box-shadow:8px 10px 0 var(--vht-shadow);padding:22px 18px;display:flex;flex-direction:column;gap:14px;min-height:280px}
.card.accent{border-color:var(--vht-accent);box-shadow:8px 10px 0 var(--vht-accent)}
.tag{font-size:22px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--vht-ink)}
.card.accent .tag{color:var(--vht-accent)}
/* mini browser */
.mini-browser{flex:1;border:3px solid var(--vht-border);border-radius:18px;background:var(--vht-bg);overflow:hidden;display:flex;flex-direction:column}
.bar{height:28px;background:var(--vht-border);display:flex;align-items:center;gap:6px;padding:0 10px}
.dot{width:8px;height:8px;border-radius:50%}
.dot.r{background:var(--vht-danger)}.dot.y{background:var(--vht-warn)}.dot.g{background:var(--vht-ok)}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.btn{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:3px solid var(--vht-warn);background:var(--vht-surface)}
.btn .g{width:22px;height:22px;border-radius:5px;background:var(--vht-accent-alt);color:var(--vht-on-accent);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.btn .t{font-size:20px;font-weight:700;color:var(--vht-title)}
/* mini control plane */
.flow{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.rack{width:52px;height:72px;border:3px solid var(--vht-accent);border-radius:10px;background:var(--vht-bg);padding:8px 6px;display:flex;flex-direction:column;gap:6px}
.slot{flex:1;border-radius:4px;background:var(--vht-border)}
.tok{border:3px solid var(--vht-accent-alt);border-radius:12px;background:var(--vht-bg);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.tok .h{font-size:16px;font-weight:700;color:var(--vht-accent-alt);text-transform:uppercase}
.chip{font-size:18px;font-weight:700;color:var(--vht-title);background:var(--vht-surface);border:2px solid var(--vht-border);border-radius:8px;padding:4px 8px}
.chip.aud{border-color:var(--vht-accent);color:var(--vht-accent)}
.arr{color:var(--vht-accent-alt);font-size:28px;font-weight:700}
#vs{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:var(--vht-accent-alt);color:var(--vht-on-accent);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 0 0 6px var(--vht-bg)}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
  <div id="wrap">
    <div class="kicker">Diagram · overlay trên A-roll</div>
    <div class="row">
      <div class="card" id="c-ux">
        <div class="tag">UX</div>
        <div class="mini-browser">
          <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
          <div class="body">
            <div class="btn"><div class="g">G</div><div class="t">Sign in</div></div>
          </div>
        </div>
      </div>
      <div class="card accent" id="c-cp">
        <div class="tag">Control plane</div>
        <div class="flow">
          <div class="rack" id="rack"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
          <div class="arr">→</div>
          <div class="tok" id="tok">
            <div class="h">token</div>
            <div class="chip aud">aud</div>
          </div>
        </div>
      </div>
    </div>
    <div id="vs">vs</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const accent = getComputedStyle(document.documentElement).getPropertyValue("--vht-accent").trim();
const tl = gsap.timeline({ paused: true });
tl.fromTo("#wrap .kicker", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.35 }, 0.05);
tl.fromTo("#c-ux", { opacity: 0, x: -50, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 0.2);
tl.fromTo("#c-cp", { opacity: 0, x: 50, scale: 0.92, boxShadow: `8px 10px 0 ${accent}` }, { opacity: 1, x: 0, scale: 1, boxShadow: `12px 14px 0 ${accent}`, duration: 0.45, ease: "back.out(1.5)" }, 0.35);
tl.fromTo("#vs", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.7);
tl.fromTo("#tok .chip", { scale: 1 }, { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 1.2);
window.__timelines["main"] = tl;
</script>
</body>
</html>
