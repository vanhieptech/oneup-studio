<!doctype html>
<html lang="vi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>ov-d01 — quyết định nằm ở Keycloak</title>
<link rel="stylesheet" href="tokens.css" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-SemiBold.ttf);font-weight:600}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Regular.ttf);font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#main{background:transparent !important}
#main{position:relative;width:100%;height:100%;overflow:hidden;font-family:"BVP",sans-serif;color:var(--vht-ink)}
#cluster{position:absolute;left:56px;right:100px;top:940px;bottom:380px;z-index:1}
#scrim{position:absolute;inset:0;border-radius:32px;border:3px solid var(--vht-border);background:var(--vht-bg);opacity:0.82;z-index:0}
#inner{position:relative;z-index:1;height:100%;padding:48px;display:flex;flex-direction:column;gap:32px}
#title{font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.15;color:var(--vht-title)}
#sub{font-size:22px;font-weight:600;color:var(--vht-ink);margin-top:-8px}
#scene{flex:1;min-height:0;position:relative}
#phone{position:absolute;left:0;top:8px;width:180px;bottom:8px;border-radius:28px;border:4px solid var(--vht-border);background:var(--vht-surface);overflow:hidden}
#notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:56px;height:8px;border-radius:6px;background:var(--vht-border)}
#screen{position:absolute;inset:28px 12px 14px;border-radius:14px;background:var(--vht-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#lbl{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--vht-warn)}
#btn{width:100%;height:44px;border-radius:10px;border:3px solid var(--vht-warn);background:var(--vht-surface);display:flex;align-items:center;justify-content:center;gap:8px}
#g{width:20px;height:20px;border-radius:5px;background:var(--vht-accent-alt);color:var(--vht-on-accent);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
#btn span{font-size:16px;font-weight:700;color:var(--vht-title)}
#xmark{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:12px;border:3px solid var(--vht-danger);background:var(--vht-surface);color:var(--vht-danger);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
#arrow1,#arrow2{position:absolute;height:5px;background:var(--vht-accent-alt);border-radius:3px;transform-origin:left center;top:50%}
#arrow1{left:192px;width:48px;margin-top:-2px}
#arrow2{left:456px;width:40px;margin-top:-2px}
#arrow1:after,#arrow2:after{content:"";position:absolute;right:-2px;top:50%;width:0;height:0;border:8px solid transparent;border-left-color:var(--vht-accent-alt);transform:translateY(-50%)}
#kc{position:absolute;left:252px;top:0;width:190px;bottom:0;border-radius:22px;border:4px solid var(--vht-accent);background:var(--vht-surface);padding:16px 14px;display:flex;flex-direction:column;gap:10px}
#kc-h{font-size:18px;font-weight:700;color:var(--vht-title);text-align:center}
#kc-role{font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--vht-accent);text-align:center}
#chip{flex:1;border-radius:12px;border:2px solid var(--vht-border);background:var(--vht-bg);padding:10px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.row{display:flex;justify-content:space-between;font-size:15px;font-weight:600;color:var(--vht-ink)}
.row.hot{color:var(--vht-accent);font-weight:700}
#apis{position:absolute;right:0;top:24px;bottom:24px;width:150px;display:flex;flex-direction:column;gap:24px}
.api{flex:1;border-radius:16px;border:3px solid var(--vht-border);background:var(--vht-surface);display:flex;align-items:center;gap:10px;padding:0 12px}
.api.ok{border-color:var(--vht-ok)}
.api.bad{border-color:var(--vht-danger)}
.dot{width:14px;height:14px;border-radius:4px}
.api.ok .dot{background:var(--vht-ok)}
.api.bad .dot{background:var(--vht-danger)}
.api span{font-size:18px;font-weight:700;color:var(--vht-title)}
#callout{align-self:flex-start;padding:10px 16px;border-radius:12px;border:3px solid var(--vht-accent);background:var(--vht-surface);font-size:20px;font-weight:700;color:var(--vht-title)}
#callout em{font-style:normal;color:var(--vht-accent)}
</style>
</head>
<body>
<!-- backdrop: hard-scrim · padding DL-071 -->
<div id="main" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920" data-fps="30">
  <div id="cluster">
    <div id="scrim" data-backdrop="hard-scrim"></div>
    <div id="inner">
      <div id="title">Quyết định bảo mật API không nằm ở nút</div>
      <div id="sub">Nằm ở authorization server — Keycloak</div>
      <div id="scene">
        <div id="phone">
          <div id="notch"></div>
          <div id="screen">
            <div id="lbl">UX only</div>
            <div id="btn"><div id="g">G</div><span>Sign in</span></div>
          </div>
          <div id="xmark">✕</div>
        </div>
        <div id="arrow1"></div>
        <div id="kc">
          <div id="kc-h">Keycloak</div>
          <div id="kc-role">Control plane</div>
          <div id="chip">
            <div class="row"><span>iss</span><span>realm</span></div>
            <div class="row hot" id="aud"><span>aud</span><span>orders-api</span></div>
            <div class="row"><span>exp</span><span>5m</span></div>
            <div class="row"><span>mfa</span><span>on</span></div>
          </div>
        </div>
        <div id="arrow2"></div>
        <div id="apis">
          <div class="api ok" id="api1"><div class="dot"></div><span>orders</span></div>
          <div class="api bad" id="api2"><div class="dot"></div><span>payments</span></div>
        </div>
      </div>
      <div id="callout">Nút = cửa · <em>Keycloak giữ chìa</em></div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#scrim", { opacity: 0, scale: 0.97 }, { opacity: 0.82, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
tl.fromTo("#title", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.1);
tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.3);
tl.fromTo("#phone", { opacity: 0, x: -36, rotate: -3 }, { opacity: 1, x: 0, rotate: 0, duration: 0.5, ease: "back.out(1.4)" }, 0.55);
tl.fromTo("#xmark", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.2);
tl.fromTo("#arrow1", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, 1.7);
tl.fromTo("#kc", { opacity: 0, scale: 0.9, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 2.1);
tl.fromTo("#arrow2", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, 2.9);
tl.fromTo("#api1", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.35, ease: "power4.out" }, 3.2);
tl.fromTo("#api2", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.35, ease: "power4.out" }, 3.4);
tl.to("#aud", { scale: 1.05, duration: 0.28, yoyo: true, repeat: 3, ease: "sine.inOut", transformOrigin: "center" }, 4.5);
tl.fromTo("#callout", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 6.0);
tl.to("#kc", { borderColor: "var(--vht-accent-alt)", duration: 0.4, yoyo: true, repeat: 3 }, 7.2);
window.__timelines["main"] = tl;
</script>
</body>
</html>
