<!doctype html>
<html lang="vi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>ov-q — Login OK · API 401 · aud trap</title>
<link rel="stylesheet" href="tokens.css" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-SemiBold.ttf);font-weight:600}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Regular.ttf);font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#main{background:transparent !important}
#main{position:relative;width:100%;height:100%;overflow:hidden;font-family:"BVP",sans-serif;color:var(--vht-ink)}
#cluster{position:absolute;left:56px;right:100px;top:940px;bottom:380px;z-index:1}
#scrim{position:absolute;inset:0;border-radius:32px;border:3px solid var(--vht-border);background:var(--vht-bg);opacity:0.82;z-index:0}
#inner{position:relative;z-index:1;height:100%;padding:48px;display:flex;flex-direction:column;gap:32px}
#eyebrow{font-size:18px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--vht-danger)}
#punch{font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1.12;color:var(--vht-title)}
#story{display:flex;gap:16px;flex-shrink:0}
.step{flex:1;border-radius:16px;border:3px solid var(--vht-border);background:var(--vht-surface);padding:14px 12px}
.step.ok{border-color:var(--vht-ok)}
.step.bad{border-color:var(--vht-danger)}
.step .s{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--vht-ink)}
.step.ok .s{color:var(--vht-ok)}
.step.bad .s{color:var(--vht-danger)}
.step .m{margin-top:6px;font-size:22px;font-weight:700;color:var(--vht-title)}
#row{flex:1;min-height:0;position:relative}
#jwt{position:absolute;left:0;top:0;bottom:0;width:48%;border-radius:20px;border:3px solid var(--vht-border);background:var(--vht-surface);padding:18px 16px;display:flex;flex-direction:column}
#jwt h3{font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--vht-ink);margin-bottom:12px}
.claim{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:8px;background:var(--vht-bg);font-size:20px;font-weight:600}
.claim span:first-child{color:var(--vht-ink)}
.claim span:last-child{color:var(--vht-title)}
.claim.bad{border:2px solid var(--vht-danger)}
.claim.bad span:last-child{color:var(--vht-on-accent);background:var(--vht-warn);padding:2px 10px;border-radius:8px}
#arrow{position:absolute;left:50%;top:50%;width:40px;height:5px;margin-left:-20px;margin-top:-2px;background:var(--vht-danger);border-radius:3px;transform-origin:left center}
#arrow:after{content:"";position:absolute;right:-2px;top:50%;width:0;height:0;border:8px solid transparent;border-left-color:var(--vht-danger);transform:translateY(-50%)}
#resp{position:absolute;right:0;top:0;bottom:0;width:42%;border-radius:20px;border:3px solid var(--vht-danger);background:var(--vht-surface);padding:18px 16px;display:flex;flex-direction:column;justify-content:center}
#resp .code{font-size:48px;font-weight:700;color:var(--vht-danger);letter-spacing:-0.03em}
#resp .why{margin-top:12px;font-size:20px;font-weight:700;color:var(--vht-title);line-height:1.25}
#resp .fix{margin-top:12px;font-size:18px;font-weight:700;color:var(--vht-accent)}
</style>
</head>
<body>
<!-- backdrop: hard-scrim · padding DL-071 -->
<div id="main" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920" data-fps="30">
  <div id="cluster">
    <div id="scrim" data-backdrop="hard-scrim"></div>
    <div id="inner">
      <div id="eyebrow">Trap · aud</div>
      <div id="punch">Login Keycloak OK — API vẫn 401</div>
      <div id="story">
        <div class="step ok" id="s1"><div class="s">01 Login</div><div class="m">Keycloak ✓</div></div>
        <div class="step bad" id="s2"><div class="s">02 API</div><div class="m">401</div></div>
        <div class="step" id="s3"><div class="s">03 Root</div><div class="m">sai aud</div></div>
      </div>
      <div id="row">
        <div id="jwt">
          <h3>Access token</h3>
          <div class="claim"><span>iss</span><span>realm</span></div>
          <div class="claim bad" id="aud"><span>aud</span><span>account</span></div>
          <div class="claim"><span>exp</span><span>5m</span></div>
        </div>
        <div id="arrow"></div>
        <div id="resp">
          <div class="code">401</div>
          <div class="why">Không phải API hư — token thiếu aud đúng</div>
          <div class="fix">cần aud = orders-api</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#scrim", { opacity: 0, scale: 0.97 }, { opacity: 0.82, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
tl.fromTo("#eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.08);
tl.fromTo("#punch", { opacity: 0, y: 18, clipPath: "inset(0 0 100% 0)" }, { opacity: 1, y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.45, ease: "power4.out" }, 0.2);
tl.fromTo("#s1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 0.65);
tl.fromTo("#s2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 1.6);
tl.to("#s2 .m", { scale: 1.08, duration: 0.28, yoyo: true, repeat: 2, ease: "sine.inOut", transformOrigin: "left center" }, 2.1);
tl.fromTo("#s3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 3.1);
tl.to("#s3", { borderColor: "var(--vht-warn)", duration: 0.25 }, 3.2);
tl.fromTo("#jwt", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.3)" }, 3.9);
tl.fromTo("#arrow", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, 4.6);
tl.fromTo("#resp", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.3)" }, 4.9);
tl.to("#aud", { scale: 1.04, duration: 0.26, yoyo: true, repeat: 5, ease: "sine.inOut", transformOrigin: "center" }, 5.8);
tl.to("#resp .code", { scale: 1.05, duration: 0.3, yoyo: true, repeat: 2, ease: "sine.inOut", transformOrigin: "left center" }, 7.5);
window.__timelines["main"] = tl;
</script>
</body>
</html>
