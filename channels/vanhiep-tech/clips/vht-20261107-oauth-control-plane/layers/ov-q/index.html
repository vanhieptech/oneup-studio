<!doctype html>
<html lang="vi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>ov-q — end card CTA</title>
<link rel="stylesheet" href="tokens.css" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#main{background:transparent}
#main{position:relative;width:100%;height:100%;overflow:hidden;font-family:"BVP",sans-serif}
#card{position:absolute;left:48px;right:48px;top:520px;border-radius:40px;padding:48px 44px 52px;background:color-mix(in srgb, var(--vht-bg) 92%, transparent);border:3px solid var(--vht-accent);box-shadow:0 36px 100px color-mix(in srgb, var(--vht-bg) 80%, transparent), 0 0 0 1px color-mix(in srgb, var(--vht-accent) 30%, transparent);backdrop-filter:blur(18px);overflow:hidden}
#ring{position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;border:24px solid color-mix(in srgb, var(--vht-accent) 25%, transparent);pointer-events:none}
#qmark{position:absolute;right:48px;top:40px;width:100px;height:100px;border-radius:28px;background:var(--vht-accent);display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:700;color:var(--vht-on-accent);box-shadow:0 16px 40px color-mix(in srgb,var(--vht-accent) 45%, transparent)}
#eyebrow{position:relative;font-size:22px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--vht-accent);margin-bottom:20px}
#ask{position:relative;font-size:56px;font-weight:700;letter-spacing:-0.035em;line-height:1.12;color:var(--vht-title);max-width:720px}
#cta{position:relative;margin-top:36px;display:inline-flex;align-items:center;gap:14px;padding:18px 28px;border-radius:18px;background:var(--vht-accent);color:var(--vht-on-accent);font-size:26px;font-weight:700}
#cta svg{width:28px;height:28px}
#pulse{position:absolute;left:44px;right:44px;bottom:0;height:8px;background:var(--vht-accent);transform-origin:left center}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920" data-fps="30">
  <div id="card">
    <div id="ring" data-layout-allow-overflow></div>
    <div id="qmark">?</div>
    <div id="eyebrow">Câu hỏi cuối</div>
    <div id="ask">Auth của bạn… còn nằm ở nút login?</div>
    <div id="cta">
      <svg viewBox="0 0 28 28" fill="none"><path d="M4 14h16M14 8l6 6-6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Comment: Keycloak / Cognito / Auth0?
    </div>
    <div id="pulse"></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#card", { opacity: 0, y: 70, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0.08);
tl.fromTo("#qmark", { opacity: 0, scale: 0.4, rotate: -25 }, { opacity: 1, scale: 1, rotate: 0, duration: 0.5, ease: "back.out(2.2)" }, 0.2);
tl.fromTo("#eyebrow", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.35);
tl.fromTo("#ask", { opacity: 0, y: 36, clipPath: "inset(0 0 100% 0)" }, { opacity: 1, y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.55, ease: "power4.out" }, 0.5);
tl.fromTo("#cta", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.95);
tl.fromTo("#pulse", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, 1.15);
tl.fromTo("#ring", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "sine.out" }, 0.4);
tl.to("#qmark", { y: -10, duration: 0.9, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.6);
tl.to("#cta", { scale: 1.03, duration: 0.45, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.2);
window.__timelines["main"] = tl;
</script>
</body>
</html>
