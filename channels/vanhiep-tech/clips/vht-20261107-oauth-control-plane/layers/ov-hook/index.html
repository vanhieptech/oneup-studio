<!doctype html>
<html lang="vi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>ov-hook — myth · Sign-in ≠ OAuth xong</title>
<link rel="stylesheet" href="tokens.css" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-SemiBold.ttf);font-weight:600}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Regular.ttf);font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#main{background:transparent !important}
#main{position:relative;width:100%;height:100%;overflow:hidden;font-family:"BVP",sans-serif;color:var(--vht-ink)}
/*
  DL-071 fix: cluster needs REAL height.
  Was top:1120 + bottom:420 → only ~380px → padding crushed.
  Now top:960 + bottom:380 → ~580px; inner pad 48; gap 32.
*/
#cluster{position:absolute;left:56px;right:100px;top:960px;bottom:380px;z-index:1}
#scrim{position:absolute;inset:0;border-radius:32px;border:3px solid var(--vht-border);background:var(--vht-bg);opacity:0.82;z-index:0}
#inner{position:relative;z-index:1;height:100%;padding:48px;display:flex;flex-direction:column;gap:32px}
#kicker{font-size:22px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--vht-warn);flex-shrink:0}
#title{font-size:38px;font-weight:700;letter-spacing:-0.03em;line-height:1.15;color:var(--vht-title);flex-shrink:0}
#scene{flex:1;min-height:280px;display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:stretch}
#phone{border-radius:28px;border:3px solid var(--vht-border);background:var(--vht-surface);display:flex;flex-direction:column;padding:28px 20px;gap:20px;justify-content:center}
#phone .cap{font-size:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--vht-warn);text-align:center}
#btn{height:56px;border-radius:14px;border:3px solid var(--vht-warn);background:var(--vht-bg);display:flex;align-items:center;justify-content:center;gap:10px}
#g{width:26px;height:26px;border-radius:6px;background:var(--vht-accent-alt);color:var(--vht-on-accent);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#btn span{font-size:18px;font-weight:700;color:var(--vht-title)}
#cards{display:flex;flex-direction:column;gap:24px;min-height:0}
.card{flex:1;border-radius:20px;border:3px solid var(--vht-border);background:var(--vht-surface);padding:24px 28px;display:flex;align-items:center;gap:20px;min-height:96px}
.card.ok{border-color:var(--vht-ok)}
.card.bad{border-color:var(--vht-danger)}
.card .dot{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--vht-on-accent)}
.card.ok .dot{background:var(--vht-ok)}
.card.bad .dot{background:var(--vht-danger)}
.card .lbl{font-size:16px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.card.ok .lbl{color:var(--vht-ok)}
.card.bad .lbl{color:var(--vht-danger)}
.card .msg{margin-top:6px;font-size:24px;font-weight:700;color:var(--vht-title);line-height:1.25}
#tag{flex-shrink:0;align-self:flex-start;display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:16px;border:3px solid var(--vht-border);background:var(--vht-surface);font-size:22px;font-weight:700;color:var(--vht-title)}
#tag em{font-style:normal;color:var(--vht-accent)}
</style>
</head>
<body>
<!-- backdrop: hard-scrim · pad 48 · gap 32 · cluster h≈580 (DL-071) -->
<div id="main" data-composition-id="main" data-start="0" data-duration="7.5" data-width="1080" data-height="1920" data-fps="30">
  <div id="cluster">
    <div id="scrim" data-backdrop="hard-scrim"></div>
    <div id="inner">
      <div id="kicker">Myth · OAuth</div>
      <div id="title">Có nút «Sign in with…» ≠ xong OAuth</div>
      <div id="scene">
        <div id="phone">
          <div class="cap">UX layer</div>
          <div id="btn"><div id="g">G</div><span>Sign in with…</span></div>
        </div>
        <div id="cards">
          <div class="card ok" id="myth">
            <div class="dot">✓</div>
            <div>
              <div class="lbl">Team nghĩ</div>
              <div class="msg">OAuth xong rồi</div>
            </div>
          </div>
          <div class="card bad" id="bust">
            <div class="dot">✕</div>
            <div>
              <div class="lbl">Thật ra</div>
              <div class="msg">Nút chỉ là UX — chưa phải control plane</div>
            </div>
          </div>
        </div>
      </div>
      <div id="tag">Nút login = cửa · <em>Keycloak = chìa</em></div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#scrim", { opacity: 0, scale: 0.98 }, { opacity: 0.82, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
tl.fromTo("#kicker", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.08);
tl.fromTo("#title", { opacity: 0, y: 18, clipPath: "inset(0 0 100% 0)" }, { opacity: 1, y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.5, ease: "power4.out" }, 0.2);
tl.fromTo("#phone", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.3)" }, 0.5);
tl.fromTo("#btn", { scale: 0.94 }, { scale: 1.04, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.95);
tl.fromTo("#myth", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.3)" }, 1.3);
tl.fromTo("#bust", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power4.out" }, 2.9);
tl.to("#myth", { borderColor: "var(--vht-muted)", duration: 0.35 }, 2.9);
tl.to("#myth .dot", { background: "var(--vht-muted)", duration: 0.35 }, 2.9);
tl.fromTo("#tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.8);
tl.to("#bust .dot", { scale: 1.1, duration: 0.28, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.6);
window.__timelines["main"] = tl;
</script>
</body>
</html>
