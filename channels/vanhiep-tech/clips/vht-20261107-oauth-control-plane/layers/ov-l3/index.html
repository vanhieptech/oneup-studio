<!doctype html>
<html lang="vi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>ov-l3 — lower third · no plate</title>
<link rel="stylesheet" href="tokens.css" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#main{background:transparent !important}
#main{position:relative;width:100%;height:100%;overflow:hidden;font-family:"BVP",sans-serif}
#row{position:absolute;left:48px;right:48px;bottom:300px;display:flex;align-items:center;gap:24px}
#badge{width:88px;height:88px;border-radius:22px;background:var(--vht-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 12px 28px color-mix(in srgb,var(--vht-accent) 40%, transparent)}
#badge span{font-size:28px;font-weight:700;color:var(--vht-on-accent);letter-spacing:-0.02em}
#copy{flex:1;min-width:0}
#k{font-size:20px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--vht-accent);margin-bottom:8px;text-shadow:0 4px 16px color-mix(in srgb, var(--vht-bg) 80%, transparent)}
#t{font-size:44px;font-weight:700;letter-spacing:-0.03em;line-height:1.1;color:var(--vht-title);text-shadow:0 6px 24px color-mix(in srgb, var(--vht-bg) 85%, transparent)}
#underline{position:absolute;left:160px;right:48px;bottom:280px;height:6px;background:var(--vht-accent);transform-origin:left center;border-radius:3px}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1080" data-height="1920" data-fps="30">
  <div id="row">
    <div id="badge"><span>aud</span></div>
    <div id="copy">
      <div id="k">Claim quyết định</div>
      <div id="t">Audience đúng API mới vào</div>
    </div>
  </div>
  <div id="underline"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#badge", { opacity: 0, scale: 0.6, x: -30 }, { opacity: 1, scale: 1, x: 0, duration: 0.45, ease: "back.out(2)" }, 0.08);
tl.fromTo("#k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.25);
tl.fromTo("#t", { opacity: 0, y: 20, clipPath: "inset(0 0 100% 0)" }, { opacity: 1, y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.45, ease: "power4.out" }, 0.35);
tl.fromTo("#underline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.55);
tl.to("#badge", { rotate: 3, duration: 0.8, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.4);
window.__timelines["main"] = tl;
</script>
</body>
</html>
