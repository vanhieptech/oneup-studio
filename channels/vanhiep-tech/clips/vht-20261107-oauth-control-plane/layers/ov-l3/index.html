<!doctype html>
<html lang="vi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>ov-l3 — takeaway + CTA aud</title>
<link rel="stylesheet" href="tokens.css" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-SemiBold.ttf);font-weight:600}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Regular.ttf);font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#main{background:transparent !important}
#main{position:relative;width:100%;height:100%;overflow:hidden;font-family:"BVP",sans-serif;color:var(--vht-ink)}
#cluster{position:absolute;left:56px;right:100px;bottom:380px;z-index:1}
#scrim{position:absolute;inset:0;border-radius:32px;border:3px solid var(--vht-border);background:var(--vht-bg);opacity:0.82;z-index:0}
#inner{position:relative;z-index:1;padding:48px;display:flex;flex-direction:column;gap:32px}
#k{font-size:18px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--vht-accent)}
#t{font-size:32px;font-weight:700;letter-spacing:-0.03em;line-height:1.15;color:var(--vht-title)}
#chips{display:flex;gap:24px;align-items:stretch}
.chip{flex:1;border-radius:16px;border:3px solid var(--vht-border);background:var(--vht-surface);padding:24px 20px}
.chip.hot{border-color:var(--vht-accent)}
.chip .k{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--vht-ink)}
.chip .v{margin-top:8px;font-size:20px;font-weight:700;color:var(--vht-title)}
.chip.hot .v{color:var(--vht-accent)}
#cta{border-radius:18px;border:3px solid var(--vht-warn);background:var(--vht-surface);padding:18px 20px}
#cta .q{font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--vht-warn)}
#cta .a{margin-top:8px;font-size:24px;font-weight:700;color:var(--vht-title);line-height:1.25}
#cta em{font-style:normal;color:var(--vht-accent)}
</style>
</head>
<body>
<!-- backdrop: hard-scrim · padding DL-071 -->
<div id="main" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920" data-fps="30">
  <div id="cluster">
    <div id="scrim" data-backdrop="hard-scrim"></div>
    <div id="inner">
      <div id="k">Takeaway</div>
      <div id="t">Identity = control plane, không phải trang login</div>
      <div id="chips">
        <div class="chip" id="c1"><div class="k">UX</div><div class="v">nút Sign-in</div></div>
        <div class="chip hot" id="c2"><div class="k">Plane</div><div class="v">Keycloak</div></div>
        <div class="chip" id="c3"><div class="k">Gate</div><div class="v">verify aud</div></div>
      </div>
      <div id="cta">
        <div class="q">CTA</div>
        <div class="a">Bạn đang verify <em>aud</em> trên từng API chưa?</div>
      </div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#scrim", { opacity: 0, y: 16 }, { opacity: 0.82, y: 0, duration: 0.4, ease: "power3.out" }, 0);
tl.fromTo("#k", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.08);
tl.fromTo("#t", { opacity: 0, y: 16, clipPath: "inset(0 0 100% 0)" }, { opacity: 1, y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.4, ease: "power4.out" }, 0.2);
tl.fromTo("#c1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 0.5);
tl.fromTo("#c2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 0.65);
tl.fromTo("#c3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 0.8);
tl.to("#c2", { scale: 1.03, duration: 0.3, yoyo: true, repeat: 2, ease: "sine.inOut" }, 1.4);
tl.fromTo("#cta", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power4.out" }, 3.0);
tl.to("#cta", { borderColor: "var(--vht-accent)", duration: 0.35, yoyo: true, repeat: 3 }, 4.0);
window.__timelines["main"] = tl;
</script>
</body>
</html>
