<!doctype html>
<html lang="vi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>ov-l3 — lower third</title>
<link rel="stylesheet" href="tokens.css" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-SemiBold.ttf);font-weight:600}
@font-face{font-family:"BVP";src:url(fonts/BeVietnamPro-Regular.ttf);font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#main{background:transparent}
#main{position:relative;width:100%;height:100%;overflow:hidden;font-family:"BVP",sans-serif}
#l3{position:absolute;left:48px;right:48px;bottom:400px;display:flex;align-items:stretch;gap:0;border-radius:20px;overflow:hidden;box-shadow:10px 12px 0 var(--vht-shadow)}
.bar{width:18px;background:var(--vht-accent);flex-shrink:0}
.body{flex:1;background:var(--vht-surface);border:4px solid var(--vht-border);border-left:none;border-radius:0 20px 20px 0;padding:22px 28px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--vht-accent)}
.line{font-size:36px;font-weight:700;color:var(--vht-title);letter-spacing:-0.02em;line-height:1.2}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920" data-fps="30">
  <div id="l3">
    <div class="bar"></div>
    <div class="body">
      <div class="eyebrow">Takeaway</div>
      <div class="line">Identity = control plane · không phải trang login</div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#l3", { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
tl.fromTo("#l3 .bar", { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power2.out", transformOrigin: "center top" }, 0.2);
window.__timelines["main"] = tl;
</script>
</body>
</html>
